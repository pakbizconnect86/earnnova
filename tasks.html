<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earn — EarnNova</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E1F; --surface:rgba(255,255,255,0.045); --surface-border:rgba(255,255,255,0.09);
    --text:#EDEFF7; --muted:#8D94B8; --indigo:#5B6EF5; --indigo-soft:#818CF8; --teal:#22D3B8;
    --radius:18px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:radial-gradient(circle at 15% 0%, rgba(91,110,245,0.16), transparent 45%), var(--bg);
    color:var(--text); font-family:'Inter', sans-serif; padding-bottom:80px;
  }
  h1,.brand{font-family:'Sora', sans-serif;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:760px; margin:0 auto; padding:0 18px;}

  header{
    position:sticky; top:0; z-index:50; backdrop-filter:blur(14px);
    background:rgba(10,14,31,0.75); border-bottom:1px solid var(--surface-border);
  }
  .nav{display:flex; align-items:center; gap:14px; padding:14px 18px; max-width:760px; margin:0 auto;}
  .back{font-size:18px;}
  .nav h1{font-size:17px; font-weight:700;}

  .filter-row{display:flex; gap:8px; overflow-x:auto; margin-top:18px; padding-bottom:4px;}
  .filter-chip{
    flex-shrink:0; padding:9px 15px; border-radius:999px; font-size:12.5px; font-weight:600;
    border:1px solid var(--surface-border); background:var(--surface); color:var(--muted); cursor:pointer;
  }
  .filter-chip.active{background:rgba(91,110,245,0.16); border-color:rgba(91,110,245,0.4); color:var(--indigo-soft);}

  .task-list{display:flex; flex-direction:column; gap:10px; margin-top:16px;}
  .task-card{
    background:var(--surface); border:1px solid var(--surface-border); border-radius:var(--radius); padding:16px;
  }
  .task-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .task-cat{font-size:11px; color:var(--indigo-soft); font-weight:600;}
  .task-title{font-size:15px; font-weight:700; margin-top:4px;}
  .task-desc{color:var(--muted); font-size:12.5px; margin-top:6px; line-height:1.5;}
  .task-reward{font-family:'Sora'; font-weight:800; font-size:16px; color:var(--teal); white-space:nowrap;}
  .task-meta{display:flex; gap:14px; margin-top:12px; font-size:11.5px; color:var(--muted);}
  .task-status{
    display:inline-block; margin-top:10px; padding:4px 10px; border-radius:999px; font-size:10.5px; font-weight:700;
  }
  .task-status.Available{background:rgba(34,211,184,0.14); color:var(--teal);}
  .task-status.Expired{background:rgba(242,107,107,0.14); color:#F26B6B;}

  .empty{color:var(--muted); font-size:13.5px; text-align:center; padding:36px 0;}

  .bottom-nav{
    position:fixed; bottom:0; left:0; right:0; z-index:60;
    display:flex; justify-content:space-around; align-items:center;
    background:rgba(10,14,31,0.92); backdrop-filter:blur(14px);
    border-top:1px solid var(--surface-border); padding:10px 0 14px;
  }
  .bottom-nav a{font-size:11px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:4px;}
  .bottom-nav a.active{color:var(--indigo-soft);}
  .bottom-nav .ic{width:20px; height:20px; border-radius:6px; background:rgba(255,255,255,0.08);}
</style>
</head>
<body>

<header>
  <div class="nav">
    <a class="back" href="dashboard.html">←</a>
    <h1>Earning Opportunities</h1>
  </div>
</header>

<div class="wrap">
  <div class="filter-row" id="filterRow">
    <div class="filter-chip active" data-cat="all">All</div>
    <div class="filter-chip" data-cat="Micro Tasks">Micro Tasks</div>
    <div class="filter-chip" data-cat="Content Tasks">Content</div>
    <div class="filter-chip" data-cat="Research Tasks">Research</div>
    <div class="filter-chip" data-cat="Digital Tasks">Digital</div>
    <div class="filter-chip" data-cat="Promotional Campaigns">Promo</div>
    <div class="filter-chip" data-cat="Affiliate Tasks">Affiliate</div>
  </div>

  <div class="task-list" id="taskList">
    <div class="empty">Loading opportunities...</div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="dashboard.html"><div class="ic"></div>Home</a>
  <a href="tasks.html" class="active"><div class="ic"></div>Earn</a>
  <a href="wallet.html"><div class="ic"></div>Wallet</a>
  <a href="referrals.html"><div class="ic"></div>Referrals</a>
  <a href="profile.html"><div class="ic"></div>Profile</a>
</nav>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  function fmt(n) { return 'PKR ' + Number(n || 0).toLocaleString('en-PK'); }

  let allTasks = [];

  function render(cat) {
    const listEl = document.getElementById('taskList');
    const rows = cat === 'all' ? allTasks : allTasks.filter(t => t.category === cat);
    if (rows.length === 0) {
      listEl.innerHTML = '<div class="empty">No earning opportunities are available right now.</div>';
      return;
    }
    listEl.innerHTML = '';
    rows.forEach(({ id, data: t }) => {
      const card = document.createElement('a');
      card.href = `task-details.html?id=${id}`;
      card.className = 'task-card';
      const deadlineStr = t.deadline ? new Date(t.deadline).toLocaleDateString('en-PK', { day: 'numeric', month: 'short' }) : '—';
      card.innerHTML = `
        <div class="task-top">
          <div>
            <div class="task-cat">${t.category || ''}</div>
            <div class="task-title">${t.title || 'Untitled task'}</div>
            <div class="task-desc">${(t.description || '').slice(0, 90)}${(t.description || '').length > 90 ? '…' : ''}</div>
          </div>
          <div class="task-reward">${fmt(t.reward)}</div>
        </div>
        <div class="task-meta">
          <span>⏱ ${t.estimatedTime || '—'}</span>
          <span>📅 Due ${deadlineStr}</span>
        </div>
        <span class="task-status ${t.status}">${t.status || 'Available'}</span>
      `;
      listEl.appendChild(card);
    });
  }

  document.getElementById('filterRow').addEventListener('click', (e) => {
    const chip = e.target.closest('.filter-chip');
    if (!chip) return;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    render(chip.dataset.cat);
  });

  requireAuth(async () => {
    try {
      const taskQuery = await db.collection(COL.tasks).where('status', '==', 'Available').get();
      allTasks = taskQuery.docs.map(d => ({ id: d.id, data: d.data() }));
      render('all');
    } catch (err) {
      console.error(err);
      document.getElementById('taskList').innerHTML = '<div class="empty">Something went wrong. Please try again.</div>';
    }
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Referrals — EarnNova</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E1F; --surface:rgba(255,255,255,0.045); --surface-border:rgba(255,255,255,0.09);
    --text:#EDEFF7; --muted:#8D94B8; --indigo:#5B6EF5; --indigo-soft:#818CF8; --teal:#22D3B8;
    --radius:18px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:radial-gradient(circle at 15% 0%, rgba(91,110,245,0.16), transparent 45%), var(--bg);
    color:var(--text); font-family:'Inter', sans-serif; padding-bottom:80px;
  }
  h1,h2,.brand{font-family:'Sora', sans-serif;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:560px; margin:0 auto; padding:0 18px;}

  header{
    position:sticky; top:0; z-index:50; backdrop-filter:blur(14px);
    background:rgba(10,14,31,0.75); border-bottom:1px solid var(--surface-border);
  }
  .nav{display:flex; align-items:center; gap:14px; padding:14px 18px; max-width:560px; margin:0 auto;}
  .back{font-size:18px;}
  .nav h1{font-size:17px; font-weight:700;}

  .hero-card{
    margin-top:20px; padding:24px; border-radius:22px; text-align:center;
    background:linear-gradient(135deg, rgba(91,110,245,0.22), rgba(91,110,245,0.05));
    border:1px solid rgba(91,110,245,0.3);
  }
  .hero-card .label{color:var(--muted); font-size:13px;}
  .code-box{
    margin-top:12px; font-family:'Sora'; font-size:26px; font-weight:800; letter-spacing:0.04em;
  }
  .copy-row{display:flex; gap:10px; margin-top:16px;}
  .copy-row button{
    flex:1; padding:12px; border:none; border-radius:12px; font-weight:600; font-size:13.5px; cursor:pointer;
  }
  .copy-link{background:linear-gradient(135deg, var(--indigo), #4756D8); color:#fff;}
  .copy-code{background:rgba(255,255,255,0.08); color:var(--text); border:1px solid var(--surface-border) !important;}

  .share-row{display:flex; gap:10px; margin-top:14px;}
  .share-btn{
    flex:1; text-align:center; padding:11px; border-radius:12px; font-size:12.5px; font-weight:600;
    background:rgba(255,255,255,0.06); border:1px solid var(--surface-border);
  }

  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:18px;}
  .stat-card{background:var(--surface); border:1px solid var(--surface-border); border-radius:14px; padding:12px 6px; text-align:center;}
  .stat-card .v{font-family:'Sora'; font-size:16px; font-weight:700;}
  .stat-card .l{color:var(--muted); font-size:9.5px; margin-top:4px; line-height:1.3;}

  .section-head{margin-top:26px; margin-bottom:12px;}
  .section-head h2{font-size:16px; font-weight:700;}

  .ref-list{display:flex; flex-direction:column; gap:8px;}
  .ref-item{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--surface); border:1px solid var(--surface-border); border-radius:14px; padding:13px 14px;
  }
  .ref-name{font-size:13.5px; font-weight:600;}
  .ref-date{color:var(--muted); font-size:11px; margin-top:2px;}
  .ref-status{font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:999px;}
  .ref-status.Registered{background:rgba(91,110,245,0.14); color:var(--indigo-soft);}
  .ref-status.Active, .ref-status.Verified{background:rgba(34,211,184,0.14); color:var(--teal);}
  .empty{color:var(--muted); font-size:13.5px; text-align:center; padding:24px 0;}

  .toast{
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
    background:rgba(34,211,184,0.16); border:1px solid rgba(34,211,184,0.4); color:var(--teal);
    padding:10px 18px; border-radius:12px; font-size:13px; font-weight:600; opacity:0; transition:opacity 0.25s;
    pointer-events:none;
  }
  .toast.show{opacity:1;}

  .bottom-nav{
    position:fixed; bottom:0; left:0; right:0; z-index:60;
    display:flex; justify-content:space-around; align-items:center;
    background:rgba(10,14,31,0.92); backdrop-filter:blur(14px);
    border-top:1px solid var(--surface-border); padding:10px 0 14px;
  }
  .bottom-nav a{font-size:11px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:4px;}
  .bottom-nav a.active{color:var(--indigo-soft);}
  .bottom-nav .ic{width:22px; height:22px; display:flex; align-items:center; justify-content:center;}
  .bottom-nav .ic svg{width:100%; height:100%;}
</style>
</head>
<body>

<header>
  <div class="nav">
    <a class="back" href="dashboard.html">←</a>
    <h1>Refer & Earn</h1>
  </div>
</header>

<div class="wrap">

  <div class="hero-card">
    <div class="label">Your referral code</div>
    <div class="code-box" id="refCode">—</div>
    <div class="copy-row">
      <button class="copy-link" id="copyLinkBtn">Copy Referral Link</button>
      <button class="copy-code" id="copyCodeBtn">Copy Code</button>
    </div>
    <div class="share-row">
      <a class="share-btn" id="waShare" target="_blank">WhatsApp</a>
      <a class="share-btn" id="fbShare" target="_blank">Facebook</a>
      <a class="share-btn" id="tgShare" target="_blank">Telegram</a>
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat-card"><div class="v" id="totalRefs">0</div><div class="l">Total</div></div>
    <div class="stat-card"><div class="v" id="registeredRefs">0</div><div class="l">Registered</div></div>
    <div class="stat-card"><div class="v" id="verifiedRefs">0</div><div class="l">Verified</div></div>
    <div class="stat-card"><div class="v" id="refEarnings">PKR 0</div><div class="l">Earnings</div></div>
  </div>

  <div class="section-head"><h2>Your referrals</h2></div>
  <div class="ref-list" id="refList">
    <div class="empty">Loading...</div>
  </div>

</div>

<div class="toast" id="toast">Copied!</div>

<nav class="bottom-nav">
  <a href="dashboard.html"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg></div>Home</a>
  <a href="tasks.html"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 12h18"/></svg></div>Earn</a>
  <a href="wallet.html"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="0.6" fill="currentColor" stroke="none"/></svg></div>Wallet</a>
  <a href="referrals.html" class="active"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l1.93-1.93a5 5 0 0 0-7.07-7.07L10.5 5.5"/><path d="M14 11a5 5 0 0 0-7.07 0L5 12.93a5 5 0 0 0 7.07 7.07L13.5 18.5"/></svg></div>Referrals</a>
  <a href="profile.html"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg></div>Profile</a>
</nav>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  function fmt(n) { return 'PKR ' + Number(n || 0).toLocaleString('en-PK'); }
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1600);
  }

  let referralLink = '';
  let referralCode = '';

  document.getElementById('copyLinkBtn').addEventListener('click', () => {
    navigator.clipboard.writeText(referralLink).then(() => showToast('Referral link copied!'));
  });
  document.getElementById('copyCodeBtn').addEventListener('click', () => {
    navigator.clipboard.writeText(referralCode).then(() => showToast('Code copied!'));
  });

  requireAuth(async (user) => {
    try {
      const userDoc = await db.collection(COL.users).doc(user.uid).get();
      const u = userDoc.data() || {};
      referralCode = u.referralCode || '';
      referralLink = `${window.location.origin}${window.location.pathname.replace('referrals.html', 'register.html')}?ref=${referralCode}`;

      document.getElementById('refCode').textContent = referralCode || '—';
      document.getElementById('waShare').href = `https://wa.me/?text=${encodeURIComponent('Join me on EarnNova: ' + referralLink)}`;
      document.getElementById('fbShare').href = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(referralLink)}`;
      document.getElementById('tgShare').href = `https://t.me/share/url?url=${encodeURIComponent(referralLink)}`;

      const refQuery = await db.collection(COL.referrals).where('referrerUid', '==', user.uid).orderBy('createdAt', 'desc').get();
      const refs = refQuery.docs.map(d => d.data());

      document.getElementById('totalRefs').textContent = refs.length;
      document.getElementById('registeredRefs').textContent = refs.filter(r => r.status === 'Registered').length;
      document.getElementById('verifiedRefs').textContent = refs.filter(r => r.status === 'Verified' || r.status === 'Active').length;

      const commissionQuery = await db.collection(COL.transactions)
        .where('userId', '==', user.uid).where('type', '==', 'Referral Commission').get();
      let totalCommission = 0;
      commissionQuery.forEach(d => totalCommission += (d.data().amount || 0));
      document.getElementById('refEarnings').textContent = fmt(totalCommission);

      const listEl = document.getElementById('refList');
      if (refs.length === 0) {
        listEl.innerHTML = '<div class="empty">No referrals yet. Share your link to get started!</div>';
      } else {
        listEl.innerHTML = '';
        for (const r of refs) {
          const referredDoc = await db.collection(COL.users).doc(r.referredUid).get();
          const rd = referredDoc.data() || {};
          const dateStr = r.createdAt ? r.createdAt.toDate().toLocaleDateString('en-PK', { day: 'numeric', month: 'short' }) : '';
          const item = document.createElement('div');
          item.className = 'ref-item';
          item.innerHTML = `
            <div>
              <div class="ref-name">${rd.fullName || 'User'}</div>
              <div class="ref-date">Joined ${dateStr}</div>
            </div>
            <span class="ref-status ${r.status}">${r.status}</span>
          `;
          listEl.appendChild(item);
        }
      }
    } catch (err) {
      console.error(err);
      document.getElementById('refList').innerHTML = '<div class="empty">Something went wrong. Please try again.</div>';
    }
  });
</script>
</body>
</html>

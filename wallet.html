<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallet — EarnNova</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E1F; --surface:rgba(255,255,255,0.045); --surface-border:rgba(255,255,255,0.09);
    --text:#EDEFF7; --muted:#8D94B8; --indigo:#5B6EF5; --indigo-soft:#818CF8; --teal:#22D3B8; --danger:#F26B6B;
    --radius:18px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:radial-gradient(circle at 15% 0%, rgba(91,110,245,0.16), transparent 45%), var(--bg);
    color:var(--text); font-family:'Inter', sans-serif; padding-bottom:80px;
  }
  h1,h2,.brand{font-family:'Sora', sans-serif;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:760px; margin:0 auto; padding:0 18px;}

  header{
    position:sticky; top:0; z-index:50; backdrop-filter:blur(14px);
    background:rgba(10,14,31,0.75); border-bottom:1px solid var(--surface-border);
  }
  .nav{display:flex; align-items:center; gap:14px; padding:14px 18px; max-width:760px; margin:0 auto;}
  .back{font-size:18px;}
  .nav h1{font-size:17px; font-weight:700;}

  .hero-card{
    margin-top:20px; padding:24px; border-radius:22px;
    background:linear-gradient(135deg, rgba(91,110,245,0.22), rgba(91,110,245,0.05));
    border:1px solid rgba(91,110,245,0.3);
  }
  .hero-card .label{color:var(--muted); font-size:13px;}
  .hero-card .value{font-family:'Sora'; font-size:32px; font-weight:800; margin-top:8px;}
  .hero-actions{display:flex; gap:10px; margin-top:18px;}
  .hero-actions a{
    flex:1; text-align:center; padding:12px; border-radius:13px; font-weight:600; font-size:14px;
  }
  .btn-primary{background:linear-gradient(135deg, var(--indigo), #4756D8); color:#fff;}
  .btn-ghost{border:1px solid var(--surface-border); background:rgba(255,255,255,0.05);}

  .stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px;}
  .stat-card{background:var(--surface); border:1px solid var(--surface-border); border-radius:14px; padding:14px 10px; text-align:center;}
  .stat-card .v{font-family:'Sora'; font-size:15px; font-weight:700;}
  .stat-card .l{color:var(--muted); font-size:10.5px; margin-top:4px;}

  .section-head{margin-top:28px; margin-bottom:12px;}
  .section-head h2{font-size:16.5px; font-weight:700;}

  .filter-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px;}
  .filter-chip{
    flex-shrink:0; padding:8px 14px; border-radius:999px; font-size:12.5px; font-weight:600;
    border:1px solid var(--surface-border); background:var(--surface); color:var(--muted); cursor:pointer;
  }
  .filter-chip.active{background:rgba(91,110,245,0.16); border-color:rgba(91,110,245,0.4); color:var(--indigo-soft);}

  .activity-list{display:flex; flex-direction:column; gap:8px;}
  .activity-item{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--surface); border:1px solid var(--surface-border); border-radius:14px; padding:14px;
  }
  .activity-left{display:flex; gap:12px; align-items:center;}
  .activity-ic{width:36px; height:36px; border-radius:10px; background:rgba(255,255,255,0.06); display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0;}
  .activity-title{font-size:13.5px; font-weight:600;}
  .activity-sub{color:var(--muted); font-size:11.5px; margin-top:2px;}
  .activity-amt{font-family:'Sora'; font-weight:700; font-size:14px;}
  .activity-amt.in{color:var(--teal);}
  .activity-amt.out{color:var(--danger);}
  .empty{color:var(--muted); font-size:13.5px; text-align:center; padding:30px 0;}

  .bottom-nav{
    position:fixed; bottom:0; left:0; right:0; z-index:60;
    display:flex; justify-content:space-around; align-items:center;
    background:rgba(10,14,31,0.92); backdrop-filter:blur(14px);
    border-top:1px solid var(--surface-border); padding:10px 0 14px;
  }
  .bottom-nav a{font-size:11px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:4px;}
  .bottom-nav a.active{color:var(--indigo-soft);}
  .bottom-nav .ic{width:22px; height:22px; display:flex; align-items:center; justify-content:center;}
  .bottom-nav .ic svg{width:100%; height:100%;}

  /* ===== Glacier animated background + glass motion ===== */
  .glacier-bg{ position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
  .glacier-bg span{ position:absolute; border-radius:50%; filter:blur(70px); opacity:0.32; will-change:transform; }
  .glacier-bg span:nth-child(1){ width:280px; height:280px; background:#5B6EF5; top:-90px; left:-70px; animation:glacierFloat1 22s ease-in-out infinite; }
  .glacier-bg span:nth-child(2){ width:240px; height:240px; background:#22D3B8; top:35%; right:-90px; animation:glacierFloat2 26s ease-in-out infinite; }
  .glacier-bg span:nth-child(3){ width:220px; height:220px; background:#818CF8; bottom:-80px; left:25%; animation:glacierFloat3 20s ease-in-out infinite; }
  @keyframes glacierFloat1{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(30px,40px) scale(1.12);} }
  @keyframes glacierFloat2{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-35px,-25px) scale(1.08);} }
  @keyframes glacierFloat3{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(25px,-35px) scale(1.1);} }

  @keyframes glassFadeUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  .card, .stat-card, .main-card, .task-card, .item, .hero-card, .bal-card, .balance-card,
  .activity-item, .method, .plan, .cat-card, .step, .meta-card, .sub-card, .head-card,
  .ref-item, .menu-item, .note, .confirm-box, .status-banner, .search-box, .task-details-card{
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    animation: glassFadeUp 0.55s cubic-bezier(.2,.7,.3,1) both;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .card:active, .stat-card:active, .item:active, .task-card:active,
  .activity-item:active, .method:active, .ref-item:active, .menu-item:active{
    transform: scale(0.98);
  }
  a.task-card:hover, a.activity-item:hover, .menu-item:hover{
    border-color: rgba(91,110,245,0.4);
    box-shadow: 0 8px 30px rgba(91,110,245,0.12);
  }

  /* Glass shimmer sweep on the big hero-style panels */
  .hero-card, .bal-card, .balance-card, .main-card.wide, .head-card{
    position: relative;
    overflow: hidden;
  }
  .hero-card::before, .bal-card::before, .balance-card::before, .main-card.wide::before, .head-card::before{
    content: '';
    position: absolute;
    top: 0; left: -60%;
    width: 50%; height: 100%;
    background: linear-gradient(115deg, transparent, rgba(255,255,255,0.16), transparent);
    transform: skewX(-18deg);
    animation: glassShimmer 5.5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes glassShimmer{
    0%{ left:-60%; }
    45%{ left:130%; }
    100%{ left:130%; }
  }

  header{
    backdrop-filter: blur(20px) saturate(160%) !important;
    -webkit-backdrop-filter: blur(20px) saturate(160%) !important;
  }

  button, .btn-primary, .btn-approve, .nav-cta{
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  button:active, .btn-primary:active{ transform: scale(0.97); }
  button:not(:disabled):hover, .btn-primary:hover{ filter: brightness(1.08); }
</style>
</head>
<body>
<div class="glacier-bg"><span></span><span></span><span></span></div>

<header>
  <div class="nav">
    <a class="back" href="dashboard.html">←</a>
    <h1>Wallet</h1>
  </div>
</header>

<div class="wrap">

  <div class="hero-card">
    <div class="label">Available Balance</div>
    <div class="value" id="availBal">PKR 0</div>
    <div class="hero-actions">
      <a class="btn-primary" href="deposit.html">Deposit</a>
      <a class="btn-ghost" href="withdraw.html">Withdraw</a>
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat-card"><div class="v" id="pendingEarn">PKR 0</div><div class="l">Pending Earnings</div></div>
    <div class="stat-card"><div class="v" id="withdrawPending">PKR 0</div><div class="l">Withdrawal Pending</div></div>
    <div class="stat-card"><div class="v" id="totalEarn">PKR 0</div><div class="l">Total Earned</div></div>
  </div>

  <div class="section-head"><h2>Transaction History</h2></div>
  <div class="filter-row" id="filterRow">
    <div class="filter-chip active" data-type="all">All</div>
    <div class="filter-chip" data-type="Deposit">Deposits</div>
    <div class="filter-chip" data-type="Mining Reward">Mining Rewards</div>
    <div class="filter-chip" data-type="Withdrawal">Withdrawals</div>
    <div class="filter-chip" data-type="Referral Commission">Referrals</div>
  </div>
  <div class="activity-list" id="activityList">
    <div class="empty">Loading...</div>
  </div>

</div>

<nav class="bottom-nav">
  <a href="dashboard.html"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg></div>Home</a>
  <a href="mining.html"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 3.5c3 1 5 3 5 6-3.5 0-6-1-7.5-3"/><path d="M4 20l7-7"/><path d="M11.5 8.5c-3-1-5-3-5-6 3.5 0 6 1 7.5 3"/><path d="M20 4l-7 7"/></svg></div>Mine</a>
  <a href="wallet.html" class="active"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="0.6" fill="currentColor" stroke="none"/></svg></div>Wallet</a>
  <a href="referrals.html"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l1.93-1.93a5 5 0 0 0-7.07-7.07L10.5 5.5"/><path d="M14 11a5 5 0 0 0-7.07 0L5 12.93a5 5 0 0 0 7.07 7.07L13.5 18.5"/></svg></div>Referrals</a>
  <a href="profile.html"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg></div>Profile</a>
</nav>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  function fmt(n) { return 'PKR ' + Number(n || 0).toLocaleString('en-PK'); }

  const typeMeta = {
    'Task Reward': { ic: '✅', sign: 'in' },
    'Mining Reward': { ic: '⛏️', sign: 'in' },
    'Deposit': { ic: '💳', sign: 'in' },
    'Withdrawal': { ic: '📤', sign: 'out' },
    'Referral Commission': { ic: '🔗', sign: 'in' },
    'Subscription': { ic: '⭐', sign: 'out' },
    'Adjustment': { ic: '⚙️', sign: 'in' }
  };

  let allTx = [];

  function renderTx(filterType) {
    const listEl = document.getElementById('activityList');
    const rows = filterType === 'all' ? allTx : allTx.filter(t => t.type === filterType);
    if (rows.length === 0) {
      listEl.innerHTML = '<div class="empty">No transactions yet.</div>';
      return;
    }
    listEl.innerHTML = '';
    rows.forEach(t => {
      const meta = typeMeta[t.type] || { ic: '💠', sign: 'in' };
      const dateStr = t.createdAt ? t.createdAt.toDate().toLocaleDateString('en-PK', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
      const item = document.createElement('div');
      item.className = 'activity-item';
      item.innerHTML = `
        <div class="activity-left">
          <div class="activity-ic">${meta.ic}</div>
          <div>
            <div class="activity-title">${t.type}</div>
            <div class="activity-sub">${t.status || ''} · ${dateStr} · ${t.transactionId || ''}</div>
          </div>
        </div>
        <div class="activity-amt ${meta.sign}">${meta.sign === 'in' ? '+' : '-'} ${fmt(t.amount)}</div>
      `;
      listEl.appendChild(item);
    });
  }

  document.getElementById('filterRow').addEventListener('click', (e) => {
    const chip = e.target.closest('.filter-chip');
    if (!chip) return;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    renderTx(chip.dataset.type);
  });

  requireAuth(async (user) => {
    try {
      const walletDoc = await db.collection(COL.wallets).doc(user.uid).get();
      const w = walletDoc.data() || {};
      document.getElementById('availBal').textContent = fmt(w.availableBalance);
      document.getElementById('pendingEarn').textContent = fmt(w.pendingEarnings);
      document.getElementById('withdrawPending').textContent = fmt(w.withdrawalPending);
      document.getElementById('totalEarn').textContent = fmt(w.totalEarned);

      const txQuery = await db.collection(COL.transactions)
        .where('userId', '==', user.uid).orderBy('createdAt', 'desc').limit(100).get();
      allTx = txQuery.docs.map(d => d.data());
      renderTx('all');
    } catch (err) {
      console.error(err);
      document.getElementById('activityList').innerHTML = '<div class="empty">Ooh, that hit an iceberg 🧊 — give it another try!</div>';
    }
  });
</script>
</body>
</html>

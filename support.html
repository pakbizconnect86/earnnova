<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support — EarnNova</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E1F; --surface:rgba(255,255,255,0.045); --surface-border:rgba(255,255,255,0.09);
    --text:#EDEFF7; --muted:#8D94B8; --indigo:#5B6EF5; --indigo-soft:#818CF8; --teal:#22D3B8; --danger:#F26B6B;
    --radius:18px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:radial-gradient(circle at 15% 0%, rgba(91,110,245,0.16), transparent 45%), var(--bg);
    color:var(--text); font-family:'Inter', sans-serif; padding-bottom:40px;
  }
  h1,h2,.brand{font-family:'Sora', sans-serif;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:600px; margin:0 auto; padding:0 18px;}

  header{
    position:sticky; top:0; z-index:50; backdrop-filter:blur(14px);
    background:rgba(10,14,31,0.75); border-bottom:1px solid var(--surface-border);
  }
  .nav{display:flex; align-items:center; gap:14px; padding:14px 18px; max-width:600px; margin:0 auto;}
  .back{font-size:18px;}
  .nav h1{font-size:16px; font-weight:700;}

  .tabs{display:flex; gap:8px; margin-top:18px;}
  .tab{flex:1; text-align:center; padding:11px; border-radius:12px; font-size:13px; font-weight:600; cursor:pointer; border:1px solid var(--surface-border); background:var(--surface); color:var(--muted);}
  .tab.active{background:rgba(91,110,245,0.16); border-color:rgba(91,110,245,0.4); color:var(--indigo-soft);}
  .panel{display:none; margin-top:16px;}
  .panel.active{display:block;}

  .card{background:var(--surface); border:1px solid var(--surface-border); border-radius:var(--radius); padding:20px;}
  label{font-size:12.5px; color:var(--muted); display:block; margin-bottom:6px; margin-top:14px;}
  input, textarea, select{
    width:100%; background:rgba(255,255,255,0.04); border:1px solid var(--surface-border);
    border-radius:12px; padding:12px 14px; color:var(--text); font-size:14px; outline:none; font-family:inherit;
  }
  textarea{min-height:100px; resize:vertical;}
  button{
    width:100%; margin-top:18px; padding:13px; border:none; border-radius:13px; font-weight:600; font-size:14.5px;
    background:linear-gradient(135deg, var(--indigo), #4756D8); color:#fff; cursor:pointer;
  }
  button:disabled{opacity:0.6;}
  .msg{font-size:12.5px; margin-top:10px; text-align:center; min-height:16px;}
  .msg.ok{color:var(--teal);}
  .msg.err{color:var(--danger);}

  .list{display:flex; flex-direction:column; gap:10px;}
  .item{background:var(--surface); border:1px solid var(--surface-border); border-radius:var(--radius); padding:16px;}
  .item-top{display:flex; justify-content:space-between; align-items:flex-start;}
  .item-subject{font-size:13.5px; font-weight:700;}
  .item-cat{font-size:11px; color:var(--indigo-soft); font-weight:600; margin-top:2px;}
  .item-status{padding:4px 10px; border-radius:999px; font-size:10px; font-weight:700;}
  .item-status.Open{background:rgba(91,110,245,0.14); color:var(--indigo-soft);}
  .item-status.In_Progress{background:rgba(245,185,91,0.14); color:#F5B95B;}
  .item-status.Resolved, .item-status.Closed{background:rgba(34,211,184,0.14); color:var(--teal);}
  .item-msg{color:var(--muted); font-size:12.5px; margin-top:10px; line-height:1.5;}
  .reply-box{margin-top:10px; background:rgba(91,110,245,0.08); border:1px solid rgba(91,110,245,0.22); border-radius:12px; padding:12px; font-size:12.5px; line-height:1.5;}
  .reply-box .label{color:var(--indigo-soft); font-weight:700; font-size:11px; margin-bottom:4px;}
  .item-date{color:var(--muted); font-size:10.5px; margin-top:8px;}
  .empty{color:var(--muted); font-size:13.5px; text-align:center; padding:30px 0;}

  /* ===== Glacier animated background + glass motion ===== */
  .glacier-bg{ position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
  .glacier-bg span{ position:absolute; border-radius:50%; filter:blur(70px); opacity:0.32; will-change:transform; }
  .glacier-bg span:nth-child(1){ width:280px; height:280px; background:#5B6EF5; top:-90px; left:-70px; animation:glacierFloat1 22s ease-in-out infinite; }
  .glacier-bg span:nth-child(2){ width:240px; height:240px; background:#22D3B8; top:35%; right:-90px; animation:glacierFloat2 26s ease-in-out infinite; }
  .glacier-bg span:nth-child(3){ width:220px; height:220px; background:#818CF8; bottom:-80px; left:25%; animation:glacierFloat3 20s ease-in-out infinite; }
  @keyframes glacierFloat1{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(30px,40px) scale(1.12);} }
  @keyframes glacierFloat2{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-35px,-25px) scale(1.08);} }
  @keyframes glacierFloat3{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(25px,-35px) scale(1.1);} }

  @keyframes glassFadeUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  .card, .stat-card, .main-card, .task-card, .item, .hero-card, .bal-card, .balance-card,
  .activity-item, .method, .plan, .cat-card, .step, .meta-card, .sub-card, .head-card,
  .ref-item, .menu-item, .note, .confirm-box, .status-banner, .search-box, .task-details-card,
  .rig-card, .progress-card, .power-note, .disclaimer, .h-item, .row, .current-card, .reply-box{
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    animation: glassFadeUp 0.55s cubic-bezier(.2,.7,.3,1) both;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .card:active, .stat-card:active, .item:active, .task-card:active,
  .activity-item:active, .method:active, .ref-item:active, .menu-item:active, .h-item:active{
    transform: scale(0.98);
  }
  a.task-card:hover, a.activity-item:hover, .menu-item:hover{
    border-color: rgba(91,110,245,0.4);
    box-shadow: 0 8px 30px rgba(91,110,245,0.12);
  }

  header{
    backdrop-filter: blur(20px) saturate(160%) !important;
    -webkit-backdrop-filter: blur(20px) saturate(160%) !important;
  }

  button, .btn-primary, .btn-approve, .nav-cta{
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  button:active, .btn-primary:active{ transform: scale(0.97); }
  button:not(:disabled):hover, .btn-primary:hover{ filter: brightness(1.08); }


  /* ===== Continuous ambient glass shimmer (v2) ===== */
  .card, .stat-card, .item, .task-card, .h-item, .method, .plan, .ref-item,
  .menu-item, .row, .sub-card, .activity-item, .meta-card, .cat-card, .step{
    position: relative;
    overflow: hidden;
  }
  .card::after, .stat-card::after, .item::after, .task-card::after, .h-item::after,
  .method::after, .plan::after, .ref-item::after, .menu-item::after, .row::after,
  .sub-card::after, .activity-item::after, .meta-card::after, .cat-card::after, .step::after{
    content: '';
    position: absolute;
    top: 0; left: -70%;
    width: 40%; height: 100%;
    background: linear-gradient(115deg, transparent, rgba(255,255,255,0.07), transparent);
    transform: skewX(-18deg);
    animation: ambientShimmer 8s ease-in-out infinite;
    animation-delay: calc(var(--shimmer-delay, 0) * 1s);
    pointer-events: none;
  }
  @keyframes ambientShimmer{
    0%{ left:-70%; }
    50%{ left:140%; }
    100%{ left:140%; }
  }
  /* Stagger the shimmer across a list so cards don't all flash in unison */
  .list > *:nth-child(2n)::after, .task-list > *:nth-child(2n)::after,
  .menu-list > *:nth-child(2n)::after, .plans > *:nth-child(2n)::after{ animation-delay: 1.6s; }
  .list > *:nth-child(3n)::after, .task-list > *:nth-child(3n)::after{ animation-delay: 3.2s; }
  .list > *:nth-child(4n)::after{ animation-delay: 4.8s; }

</style>
</head>
<body>
<div class="glacier-bg"><span></span><span></span><span></span></div>

<header>
  <div class="nav">
    <a class="back" href="dashboard.html">←</a>
    <h1>Support Center</h1>
  </div>
</header>

<div class="wrap">

  <div class="tabs" id="tabRow">
    <div class="tab active" data-panel="new">New Ticket</div>
    <div class="tab" data-panel="mine">My Tickets</div>
  </div>

  <div class="panel active" id="panel-new">
    <div class="card">
      <label>Category</label>
      <select id="category">
        <option>Payment</option>
        <option>Deposit</option>
        <option>Withdrawal</option>
        <option>Mining</option>
        <option>Subscription</option>
        <option>Account</option>
        <option>Other</option>
      </select>
      <label>Subject</label>
      <input id="subject" placeholder="Briefly describe your issue">
      <label>Message</label>
      <textarea id="message" placeholder="Explain what's going on..."></textarea>
      <div class="msg" id="submitMsg"></div>
      <button id="submitBtn">Submit Ticket</button>
    </div>
  </div>

  <div class="panel" id="panel-mine">
    <div class="list" id="ticketList"><div class="empty">Loading...</div></div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  let currentUser = null;

  document.getElementById('tabRow').addEventListener('click', (e) => {
    const tab = e.target.closest('.tab');
    if (!tab) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
  });

  document.getElementById('submitBtn').addEventListener('click', async () => {
    const msg = document.getElementById('submitMsg');
    msg.textContent = '';
    const category = document.getElementById('category').value;
    const subject = document.getElementById('subject').value.trim();
    const message = document.getElementById('message').value.trim();

    if (!subject || !message) { msg.textContent = 'Subject and message are required.'; msg.className = 'msg err'; return; }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Submitting...';

    try {
      await db.collection(COL.tickets).add({
        userId: currentUser.uid,
        category, subject, message,
        status: 'Open',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      msg.textContent = 'Ticket submitted. Our team will respond soon.';
      msg.className = 'msg ok';
      document.getElementById('subject').value = '';
      document.getElementById('message').value = '';
      loadTickets();
    } catch (err) {
      console.error(err);
      msg.textContent = 'Ooh, that hit an iceberg 🧊 — give it another try!';
      msg.className = 'msg err';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Submit Ticket';
    }
  });

  async function loadTickets() {
    const listEl = document.getElementById('ticketList');
    try {
      const snap = await safeQuery(db.collection(COL.tickets),
        [['userId', '==', currentUser.uid]], 'createdAt', 'desc');
      if (snap.empty) { listEl.innerHTML = '<div class="empty">No tickets yet.</div>'; return; }
      listEl.innerHTML = '';
      snap.forEach(doc => {
        const t = doc.data();
        const dateStr = t.createdAt ? t.createdAt.toDate().toLocaleString('en-PK', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
        const statusClass = (t.status || '').replace(/ /g, '_');
        const item = document.createElement('div');
        item.className = 'item';
        item.innerHTML = `
          <div class="item-top">
            <div>
              <div class="item-subject">${t.subject}</div>
              <div class="item-cat">${t.category}</div>
            </div>
            <span class="item-status ${statusClass}">${t.status}</span>
          </div>
          <div class="item-msg">${t.message}</div>
          ${t.adminReply ? `<div class="reply-box"><div class="label">Support Team</div>${t.adminReply}</div>` : ''}
          <div class="item-date">${dateStr}</div>
        `;
        listEl.appendChild(item);
      });
    } catch (err) {
      console.error(err);
      listEl.innerHTML = '<div class="empty">Ooh, that hit an iceberg 🧊 — give it another try!</div>';
    }
  }

  requireAuth(async (user) => {
    currentUser = user;
    loadTickets();
  });
</script>
</body>
</html>

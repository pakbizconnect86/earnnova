<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — EarnNova</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E1F; --surface:rgba(255,255,255,0.045); --surface-border:rgba(255,255,255,0.09);
    --text:#EDEFF7; --muted:#8D94B8; --indigo:#5B6EF5; --indigo-soft:#818CF8; --danger:#F26B6B;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background:radial-gradient(circle at 20% 0%, rgba(91,110,245,0.18), transparent 45%), var(--bg);
    color:var(--text); font-family:'Inter', sans-serif;
  }
  .card{width:100%; max-width:400px; background:var(--surface); border:1px solid var(--surface-border); border-radius:20px; padding:30px 26px;}
  .brand{font-family:'Sora'; font-weight:700; font-size:20px; text-align:center; margin-bottom:4px;}
  .brand span{color:var(--indigo-soft);}
  h1{font-family:'Sora'; font-size:20px; font-weight:700; margin-top:20px; text-align:center;}
  p.sub{color:var(--muted); font-size:13.5px; text-align:center; margin-top:6px;}
  form{margin-top:24px; display:flex; flex-direction:column; gap:14px;}
  label{font-size:13px; color:var(--muted); margin-bottom:6px; display:block;}
  input{
    width:100%; background:rgba(255,255,255,0.04); border:1px solid var(--surface-border);
    border-radius:12px; padding:12px 14px; color:var(--text); font-size:14.5px; outline:none;
  }
  input:focus{border-color:var(--indigo-soft);}
  .row{display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--muted);}
  .row a{color:var(--indigo-soft); text-decoration:none;}
  button{
    margin-top:6px; padding:13px; border:none; border-radius:13px; font-weight:600; font-size:14.5px;
    background:linear-gradient(135deg, var(--indigo), #4756D8); color:#fff; cursor:pointer;
  }
  button:disabled{opacity:0.6;}
  .error{color:var(--danger); font-size:13px; min-height:16px;}
  .foot{text-align:center; font-size:13.5px; color:var(--muted); margin-top:20px;}
  .foot a{color:var(--indigo-soft); text-decoration:none;}

  /* ===== Glacier animated background + glass motion ===== */
  .glacier-bg{ position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
  .glacier-bg span{ position:absolute; border-radius:50%; filter:blur(70px); opacity:0.32; will-change:transform; }
  .glacier-bg span:nth-child(1){ width:280px; height:280px; background:#5B6EF5; top:-90px; left:-70px; animation:glacierFloat1 22s ease-in-out infinite; }
  .glacier-bg span:nth-child(2){ width:240px; height:240px; background:#22D3B8; top:35%; right:-90px; animation:glacierFloat2 26s ease-in-out infinite; }
  .glacier-bg span:nth-child(3){ width:220px; height:220px; background:#818CF8; bottom:-80px; left:25%; animation:glacierFloat3 20s ease-in-out infinite; }
  @keyframes glacierFloat1{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(30px,40px) scale(1.12);} }
  @keyframes glacierFloat2{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-35px,-25px) scale(1.08);} }
  @keyframes glacierFloat3{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(25px,-35px) scale(1.1);} }

  @keyframes glassFadeUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

  /* Lightweight cards (lists/repeated items) — fade-in only, NO blur (keeps scrolling smooth) */
  .stat-card, .item, .task-card, .activity-item, .method, .plan, .cat-card, .step,
  .meta-card, .sub-card, .ref-item, .menu-item, .h-item, .row{
    animation: glassFadeUp 0.4s ease both;
    transition: transform 0.15s ease, border-color 0.2s ease;
  }
  .stat-card:active, .item:active, .task-card:active, .activity-item:active,
  .method:active, .ref-item:active, .menu-item:active, .h-item:active{
    transform: scale(0.98);
  }
  a.task-card:hover, a.activity-item:hover, .menu-item:hover{
    border-color: rgba(91,110,245,0.4);
  }

  /* Prominent panels only — this is where the blur/glass look actually shows */
  .card, .main-card, .hero-card, .bal-card, .balance-card, .head-card, .note,
  .confirm-box, .status-banner, .search-box, .task-details-card, .rig-card,
  .progress-card, .power-note, .disclaimer, .current-card, .reply-box{
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    animation: glassFadeUp 0.5s cubic-bezier(.2,.7,.3,1) both;
  }

  /* Glass shimmer sweep on the big hero-style panels */
  .hero-card, .bal-card, .balance-card, .main-card.wide, .head-card{
    position: relative;
    overflow: hidden;
  }
  .hero-card::before, .bal-card::before, .balance-card::before, .main-card.wide::before, .head-card::before{
    content: '';
    position: absolute;
    top: 0; left: -60%;
    width: 50%; height: 100%;
    background: linear-gradient(115deg, transparent, rgba(255,255,255,0.16), transparent);
    transform: skewX(-18deg);
    animation: glassShimmer 5.5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes glassShimmer{
    0%{ left:-60%; }
    45%{ left:130%; }
    100%{ left:130%; }
  }

  header{
    backdrop-filter: blur(20px) saturate(160%) !important;
    -webkit-backdrop-filter: blur(20px) saturate(160%) !important;
  }

  button, .btn-primary, .btn-approve, .nav-cta{
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  button:active, .btn-primary:active{ transform: scale(0.97); }
  button:not(:disabled):hover, .btn-primary:hover{ filter: brightness(1.08); }

</style>
</head>
<body>
<div class="glacier-bg"><span></span><span></span><span></span></div>
  <div class="card">
    <div class="brand">Earn<span>Nova</span></div>
    <h1>Welcome back</h1>
    <p class="sub">Log in to continue earning.</p>
    <form id="loginForm">
      <div>
        <label for="identifier">Email or phone</label>
        <input id="identifier" type="text" required placeholder="you@example.com">
      </div>
      <div>
        <label for="password">Password</label>
        <input id="password" type="password" required placeholder="••••••••">
      </div>
      <div class="row">
        <label style="display:flex; align-items:center; gap:6px; margin:0;"><input type="checkbox" id="remember" style="width:auto;"> Remember me</label>
        <a href="#" id="forgotLink">Forgot password?</a>
      </div>
      <div class="error" id="errorMsg"></div>
      <button type="submit" id="submitBtn">Log In</button>
    </form>
    <div class="foot">New here? <a href="register.html">Create an account</a></div>
  </div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  const form = document.getElementById('loginForm');
  const errorMsg = document.getElementById('errorMsg');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in...';

    const identifier = document.getElementById('identifier').value.trim();
    const password = document.getElementById('password').value;
    const remember = document.getElementById('remember').checked;

    try {
      await auth.setPersistence(remember ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION);

      let email = identifier;
      // If identifier looks like a phone number, look up the matching email first
      if (!identifier.includes('@')) {
        const q = await db.collection(COL.users).where('phone', '==', identifier).limit(1).get();
        if (q.empty) throw { code: 'not-found' };
        email = q.docs[0].data().email;
      }

      const cred = await auth.signInWithEmailAndPassword(email, password);
      const userDoc = await db.collection(COL.users).doc(cred.user.uid).get();
      const role = userDoc.exists ? userDoc.data().role : 'user';
      window.location.href = role === 'admin' ? 'admin/dashboard.html' : 'dashboard.html';

    } catch (err) {
      const map = {
        'auth/wrong-password': 'Incorrect password.',
        'auth/user-not-found': 'No account found with that email/phone.',
        'not-found': 'No account found with that email/phone.',
        'auth/too-many-requests': 'Too many attempts. Please try again later.',
        'auth/invalid-email': 'Please enter a valid email.'
      };
      errorMsg.textContent = map[err.code] || 'Ooh, that hit an iceberg 🧊 — give it another try!';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log In';
    }
  });

  document.getElementById('forgotLink').addEventListener('click', async (e) => {
    e.preventDefault();
    const email = prompt('Enter your account email to receive a reset link:');
    if (!email) return;
    try {
      await auth.sendPasswordResetEmail(email);
      alert('Password reset link sent. Please check your email.');
    } catch (err) {
      alert('Could not send reset link. Please check the email and try again.');
    }
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Details — EarnNova</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E1F; --surface:rgba(255,255,255,0.045); --surface-border:rgba(255,255,255,0.09);
    --text:#EDEFF7; --muted:#8D94B8; --indigo:#5B6EF5; --indigo-soft:#818CF8; --teal:#22D3B8; --danger:#F26B6B;
    --radius:18px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:radial-gradient(circle at 15% 0%, rgba(91,110,245,0.16), transparent 45%), var(--bg);
    color:var(--text); font-family:'Inter', sans-serif; padding-bottom:40px;
  }
  h1,h2,.brand{font-family:'Sora', sans-serif;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:560px; margin:0 auto; padding:0 18px;}

  header{
    position:sticky; top:0; z-index:50; backdrop-filter:blur(14px);
    background:rgba(10,14,31,0.75); border-bottom:1px solid var(--surface-border);
  }
  .nav{display:flex; align-items:center; gap:14px; padding:14px 18px; max-width:560px; margin:0 auto;}
  .back{font-size:18px;}
  .nav h1{font-size:16px; font-weight:700;}

  .head-card{margin-top:18px;}
  .task-cat{font-size:11.5px; color:var(--indigo-soft); font-weight:600;}
  .task-title{font-size:22px; font-weight:800; margin-top:6px; line-height:1.2;}
  .reward-row{display:flex; align-items:center; gap:10px; margin-top:12px;}
  .reward-pill{
    background:rgba(34,211,184,0.14); color:var(--teal); font-family:'Sora'; font-weight:800; font-size:16px;
    padding:6px 14px; border-radius:999px;
  }
  .task-status{padding:5px 12px; border-radius:999px; font-size:11px; font-weight:700; background:rgba(91,110,245,0.14); color:var(--indigo-soft);}

  .meta-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;}
  .meta-card{background:var(--surface); border:1px solid var(--surface-border); border-radius:14px; padding:12px 14px;}
  .meta-card .l{color:var(--muted); font-size:11px;}
  .meta-card .v{font-size:13.5px; font-weight:600; margin-top:4px;}

  .card{background:var(--surface); border:1px solid var(--surface-border); border-radius:var(--radius); padding:18px; margin-top:16px;}
  .card h2{font-size:14.5px; font-weight:700; margin-bottom:8px;}
  .card p{color:var(--muted); font-size:13.5px; line-height:1.6;}
  .card ul{margin-top:8px; padding-left:18px; color:var(--muted); font-size:13.5px; line-height:1.7;}

  label{font-size:13px; color:var(--muted); display:block; margin-bottom:6px; margin-top:4px;}
  textarea, input{
    width:100%; background:rgba(255,255,255,0.04); border:1px solid var(--surface-border);
    border-radius:12px; padding:12px 14px; color:var(--text); font-size:14px; outline:none; font-family:inherit;
  }
  textarea{min-height:100px; resize:vertical;}
  textarea:focus, input:focus{border-color:var(--indigo-soft);}

  button{
    width:100%; margin-top:16px; padding:13px; border:none; border-radius:13px; font-weight:600; font-size:14.5px;
    background:linear-gradient(135deg, var(--indigo), #4756D8); color:#fff; cursor:pointer;
  }
  button:disabled{opacity:0.6;}
  .error{color:var(--danger); font-size:13px; min-height:16px; margin-top:6px;}

  .status-banner{
    margin-top:16px; padding:14px 16px; border-radius:14px; font-size:13.5px; line-height:1.5;
    background:rgba(91,110,245,0.1); border:1px solid rgba(91,110,245,0.28); color:var(--indigo-soft);
  }
  .hidden{display:none;}

  /* ===== Glacier animated background + glass motion ===== */
  .glacier-bg{ position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
  .glacier-bg span{ position:absolute; border-radius:50%; filter:blur(70px); opacity:0.32; will-change:transform; }
  .glacier-bg span:nth-child(1){ width:280px; height:280px; background:#5B6EF5; top:-90px; left:-70px; animation:glacierFloat1 22s ease-in-out infinite; }
  .glacier-bg span:nth-child(2){ width:240px; height:240px; background:#22D3B8; top:35%; right:-90px; animation:glacierFloat2 26s ease-in-out infinite; }
  .glacier-bg span:nth-child(3){ width:220px; height:220px; background:#818CF8; bottom:-80px; left:25%; animation:glacierFloat3 20s ease-in-out infinite; }
  @keyframes glacierFloat1{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(30px,40px) scale(1.12);} }
  @keyframes glacierFloat2{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-35px,-25px) scale(1.08);} }
  @keyframes glacierFloat3{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(25px,-35px) scale(1.1);} }

  @keyframes glassFadeUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  .card, .stat-card, .main-card, .task-card, .item, .hero-card, .bal-card, .balance-card,
  .activity-item, .method, .plan, .cat-card, .step, .meta-card, .sub-card, .head-card,
  .ref-item, .menu-item, .note, .confirm-box, .status-banner, .search-box, .task-details-card{
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    animation: glassFadeUp 0.55s cubic-bezier(.2,.7,.3,1) both;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .card:active, .stat-card:active, .item:active, .task-card:active,
  .activity-item:active, .method:active, .ref-item:active, .menu-item:active{
    transform: scale(0.98);
  }
  a.task-card:hover, a.activity-item:hover, .menu-item:hover{
    border-color: rgba(91,110,245,0.4);
    box-shadow: 0 8px 30px rgba(91,110,245,0.12);
  }

  /* Glass shimmer sweep on the big hero-style panels */
  .hero-card, .bal-card, .balance-card, .main-card.wide, .head-card{
    position: relative;
    overflow: hidden;
  }
  .hero-card::before, .bal-card::before, .balance-card::before, .main-card.wide::before, .head-card::before{
    content: '';
    position: absolute;
    top: 0; left: -60%;
    width: 50%; height: 100%;
    background: linear-gradient(115deg, transparent, rgba(255,255,255,0.16), transparent);
    transform: skewX(-18deg);
    animation: glassShimmer 5.5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes glassShimmer{
    0%{ left:-60%; }
    45%{ left:130%; }
    100%{ left:130%; }
  }

  header{
    backdrop-filter: blur(20px) saturate(160%) !important;
    -webkit-backdrop-filter: blur(20px) saturate(160%) !important;
  }

  button, .btn-primary, .btn-approve, .nav-cta{
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  button:active, .btn-primary:active{ transform: scale(0.97); }
  button:not(:disabled):hover, .btn-primary:hover{ filter: brightness(1.08); }
</style>
</head>
<body>
<div class="glacier-bg"><span></span><span></span><span></span></div>

<header>
  <div class="nav">
    <a class="back" href="tasks.html">←</a>
    <h1>Task Details</h1>
  </div>
</header>

<div class="wrap" id="content">
  <div class="empty" style="color:var(--muted); text-align:center; padding:40px 0;">Loading...</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  function fmt(n) { return 'PKR ' + Number(n || 0).toLocaleString('en-PK'); }
  const params = new URLSearchParams(window.location.search);
  const taskId = params.get('id');
  let currentUser = null;

  function renderTask(task, existingSubmission) {
    const content = document.getElementById('content');
    const deadlineStr = task.deadline ? new Date(task.deadline).toLocaleDateString('en-PK', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';

    let actionHtml = '';
    if (existingSubmission) {
      const statusMsg = {
        'Submitted': 'Task submitted successfully. Your submission is under review.',
        'Under Review': 'Your submission is currently under review.',
        'Approved': 'Your submission was approved and the reward has been credited to your pending earnings.',
        'Rejected': `Your submission was rejected. ${existingSubmission.rejectionReason || ''}`
      };
      actionHtml = `<div class="status-banner">${statusMsg[existingSubmission.status] || existingSubmission.status}</div>`;
    } else if (task.status !== 'Available') {
      actionHtml = `<div class="status-banner">This task is currently ${task.status}.</div>`;
    } else {
      actionHtml = `
        <div class="card">
          <h2>Submit your proof</h2>
          <label for="proofType">Proof type</label>
          <select id="proofType" style="width:100%; background:rgba(255,255,255,0.04); border:1px solid var(--surface-border); border-radius:12px; padding:12px 14px; color:var(--text); font-size:14px;">
            <option value="text">Text answer</option>
            <option value="link">Link (URL)</option>
          </select>
          <label for="proofText">Proof of completion</label>
          <textarea id="proofText" placeholder="Describe what you did, or paste a link as proof"></textarea>
          <div class="error" id="errorMsg"></div>
          <button id="submitBtn">Submit Work</button>
        </div>
      `;
    }

    content.innerHTML = `
      <div class="head-card">
        <div class="task-cat">${task.category || ''}</div>
        <div class="task-title">${task.title || 'Untitled task'}</div>
        <div class="reward-row">
          <div class="reward-pill">${fmt(task.reward)}</div>
          <div class="task-status">${task.status || 'Available'}</div>
        </div>
        ${task.clientBudget ? `<div style="margin-top:10px; font-size:12px; color:var(--muted);">Client budget: ${fmt(task.clientBudget)} · Platform fee: ${fmt(task.clientBudget - task.reward)} (transparent, paid by the client — not deducted from your reward)</div>` : ''}
      </div>

      <div class="meta-grid">
        <div class="meta-card"><div class="l">Estimated time</div><div class="v">${task.estimatedTime || '—'}</div></div>
        <div class="meta-card"><div class="l">Deadline</div><div class="v">${deadlineStr}</div></div>
      </div>

      <div class="card">
        <h2>Description</h2>
        <p>${task.description || 'No description provided.'}</p>
      </div>

      <div class="card">
        <h2>Instructions</h2>
        <p>${task.instructions || 'No additional instructions.'}</p>
      </div>

      ${task.requirements ? `
      <div class="card">
        <h2>Requirements</h2>
        <p>${task.requirements}</p>
      </div>` : ''}

      ${actionHtml}
    `;

    const submitBtn = document.getElementById('submitBtn');
    if (submitBtn) {
      submitBtn.addEventListener('click', async () => {
        const errorMsg = document.getElementById('errorMsg');
        const proofText = document.getElementById('proofText').value.trim();
        const proofType = document.getElementById('proofType').value;
        if (!proofText) { errorMsg.textContent = 'Please provide proof before submitting.'; return; }
        if (proofType === 'link' && !/^https?:\/\//i.test(proofText)) {
          errorMsg.textContent = 'Please enter a valid link starting with http:// or https://';
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Submitting...';

        try {
          await db.collection(COL.submissions).add({
            taskId,
            taskTitle: task.title,
            userId: currentUser.uid,
            proof: proofText,
            proofType,
            reward: task.reward,
            status: 'Submitted',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });

          await db.collection(COL.notifications).add({
            userId: currentUser.uid,
            title: 'Task submitted',
            message: `Your submission for "${task.title}" is under review.`,
            read: false,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });

          renderTask(task, { status: 'Submitted' });
        } catch (err) {
          console.error(err);
          errorMsg.textContent = 'Ooh, that hit an iceberg 🧊 — give it another try!';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Submit Work';
        }
      });
    }
  }

  requireAuth(async (user) => {
    currentUser = user;
    if (!taskId) {
      document.getElementById('content').innerHTML = '<div style="color:var(--muted); text-align:center; padding:40px 0;">Task not found.</div>';
      return;
    }
    try {
      const taskDoc = await db.collection(COL.tasks).doc(taskId).get();
      if (!taskDoc.exists) {
        document.getElementById('content').innerHTML = '<div style="color:var(--muted); text-align:center; padding:40px 0;">Task not found.</div>';
        return;
      }
      const task = taskDoc.data();

      const subQuery = await db.collection(COL.submissions)
        .where('taskId', '==', taskId).where('userId', '==', currentUser.uid).limit(1).get();
      const existing = subQuery.empty ? null : subQuery.docs[0].data();

      renderTask(task, existing);
    } catch (err) {
      console.error(err);
      document.getElementById('content').innerHTML = '<div style="color:var(--muted); text-align:center; padding:40px 0;">Ooh, that hit an iceberg 🧊 — give it another try!</div>';
    }
  });
</script>
</body>
</html>

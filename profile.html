<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — EarnNova</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E1F; --surface:rgba(255,255,255,0.045); --surface-border:rgba(255,255,255,0.09);
    --text:#EDEFF7; --muted:#8D94B8; --indigo:#5B6EF5; --indigo-soft:#818CF8; --teal:#22D3B8; --danger:#F26B6B;
    --radius:18px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:radial-gradient(circle at 15% 0%, rgba(91,110,245,0.16), transparent 45%), var(--bg);
    color:var(--text); font-family:'Inter', sans-serif; padding-bottom:80px;
  }
  h1,h2,.brand{font-family:'Sora', sans-serif;}
  a, button{color:inherit; text-decoration:none;}
  .wrap{max-width:560px; margin:0 auto; padding:0 18px;}

  header{
    position:sticky; top:0; z-index:50; backdrop-filter:blur(14px);
    background:rgba(10,14,31,0.75); border-bottom:1px solid var(--surface-border);
  }
  .nav{display:flex; align-items:center; gap:14px; padding:14px 18px; max-width:560px; margin:0 auto;}
  .back{font-size:18px;}
  .nav h1{font-size:17px; font-weight:700;}

  .profile-head{display:flex; align-items:center; gap:14px; margin-top:22px;}
  .avatar{
    width:58px; height:58px; border-radius:50%; background:linear-gradient(135deg, var(--indigo), #4756D8);
    display:flex; align-items:center; justify-content:center; font-family:'Sora'; font-weight:700; font-size:22px;
  }
  .profile-head h2{font-size:18px; font-weight:700;}
  .profile-head p{color:var(--muted); font-size:12.5px; margin-top:3px;}
  .status-pill{
    display:inline-flex; align-items:center; gap:6px; margin-top:6px; padding:4px 10px;
    border-radius:999px; background:rgba(34,211,184,0.12); color:var(--teal); font-size:11px; font-weight:600;
  }

  .card{background:var(--surface); border:1px solid var(--surface-border); border-radius:var(--radius); padding:6px 0; margin-top:20px;}
  .row{
    display:flex; justify-content:space-between; align-items:center; padding:14px 18px;
    border-bottom:1px solid var(--surface-border); font-size:13.5px;
  }
  .row:last-child{border-bottom:none;}
  .row .l{color:var(--muted);}
  .row .v{font-weight:600;}

  .section-head{margin-top:22px; margin-bottom:10px;}
  .section-head h2{font-size:14.5px; font-weight:700; color:var(--muted);}

  .action-row{
    display:flex; justify-content:space-between; align-items:center; padding:15px 18px;
    border-bottom:1px solid var(--surface-border); font-size:14px; font-weight:600; cursor:pointer;
  }
  .action-row:last-child{border-bottom:none;}
  .action-row .arrow{color:var(--muted);}
  .action-row.danger{color:var(--danger);}

  .msg{font-size:12.5px; text-align:center; margin-top:14px; min-height:16px;}
  .msg.ok{color:var(--teal);}
  .msg.err{color:var(--danger);}

  /* ===== Glacier animated background + glass motion ===== */
  .glacier-bg{ position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
  .glacier-bg span{ position:absolute; border-radius:50%; filter:blur(70px); opacity:0.32; will-change:transform; }
  .glacier-bg span:nth-child(1){ width:280px; height:280px; background:#5B6EF5; top:-90px; left:-70px; animation:glacierFloat1 22s ease-in-out infinite; }
  .glacier-bg span:nth-child(2){ width:240px; height:240px; background:#22D3B8; top:35%; right:-90px; animation:glacierFloat2 26s ease-in-out infinite; }
  .glacier-bg span:nth-child(3){ width:220px; height:220px; background:#818CF8; bottom:-80px; left:25%; animation:glacierFloat3 20s ease-in-out infinite; }
  @keyframes glacierFloat1{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(30px,40px) scale(1.12);} }
  @keyframes glacierFloat2{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-35px,-25px) scale(1.08);} }
  @keyframes glacierFloat3{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(25px,-35px) scale(1.1);} }

  @keyframes glassFadeUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  .card, .stat-card, .main-card, .task-card, .item, .hero-card, .bal-card, .balance-card,
  .activity-item, .method, .plan, .cat-card, .step, .meta-card, .sub-card, .head-card,
  .ref-item, .menu-item, .note, .confirm-box, .status-banner, .search-box, .task-details-card{
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    animation: glassFadeUp 0.55s cubic-bezier(.2,.7,.3,1) both;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .card:active, .stat-card:active, .item:active, .task-card:active,
  .activity-item:active, .method:active, .ref-item:active, .menu-item:active{
    transform: scale(0.98);
  }
  a.task-card:hover, a.activity-item:hover, .menu-item:hover{
    border-color: rgba(91,110,245,0.4);
    box-shadow: 0 8px 30px rgba(91,110,245,0.12);
  }

  /* Glass shimmer sweep on the big hero-style panels */
  .hero-card, .bal-card, .balance-card, .main-card.wide, .head-card{
    position: relative;
    overflow: hidden;
  }
  .hero-card::before, .bal-card::before, .balance-card::before, .main-card.wide::before, .head-card::before{
    content: '';
    position: absolute;
    top: 0; left: -60%;
    width: 50%; height: 100%;
    background: linear-gradient(115deg, transparent, rgba(255,255,255,0.16), transparent);
    transform: skewX(-18deg);
    animation: glassShimmer 5.5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes glassShimmer{
    0%{ left:-60%; }
    45%{ left:130%; }
    100%{ left:130%; }
  }

  header{
    backdrop-filter: blur(20px) saturate(160%) !important;
    -webkit-backdrop-filter: blur(20px) saturate(160%) !important;
  }

  button, .btn-primary, .btn-approve, .nav-cta{
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  button:active, .btn-primary:active{ transform: scale(0.97); }
  button:not(:disabled):hover, .btn-primary:hover{ filter: brightness(1.08); }
</style>
</head>
<body>
<div class="glacier-bg"><span></span><span></span><span></span></div>

<header>
  <div class="nav">
    <a class="back" href="dashboard.html">←</a>
    <h1>Profile</h1>
  </div>
</header>

<div class="wrap">

  <div class="profile-head">
    <div class="avatar" id="avatarInitial">?</div>
    <div>
      <h2 id="fullName">Loading...</h2>
      <p id="userIdLine">—</p>
      <div class="status-pill"><span id="statusText">Active</span></div>
    </div>
  </div>

  <div class="section-head"><h2>ACCOUNT DETAILS</h2></div>
  <div class="card">
    <div class="row"><span class="l">Email</span><span class="v" id="email">—</span></div>
    <div class="row"><span class="l">Phone</span><span class="v" id="phone">—</span></div>
    <div class="row"><span class="l">Referral Code</span><span class="v" id="refCode">—</span></div>
    <div class="row"><span class="l">Account Created</span><span class="v" id="createdAt">—</span></div>
    <a class="row" href="subscription.html" style="text-decoration:none; color:inherit;"><span class="l">Subscription</span><span class="v" id="subPlan">None ›</span></a>
  </div>

  <div class="section-head"><h2>SETTINGS</h2></div>
  <div class="card">
    <div class="action-row" id="changePwd"><span>Change Password</span><span class="arrow">›</span></div>
    <a class="action-row" href="support.html"><span>Support Center</span><span class="arrow">›</span></a>
    <div class="action-row danger" id="logoutBtn"><span>Logout</span><span class="arrow">›</span></div>
  </div>

  <div class="msg" id="msg"></div>

</div>

<nav class="bottom-nav" style="position:fixed; bottom:0; left:0; right:0; z-index:60; display:flex; justify-content:space-around; align-items:center; background:rgba(10,14,31,0.92); backdrop-filter:blur(14px); border-top:1px solid var(--surface-border); padding:10px 0 14px;">
  <a href="dashboard.html" style="font-size:11px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:4px;"><div style="width:22px; height:22px; display:flex; align-items:center; justify-content:center;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg></div>Home</a>
  <a href="mining.html" style="font-size:11px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:4px;"><div style="width:22px; height:22px; display:flex; align-items:center; justify-content:center;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 3.5c3 1 5 3 5 6-3.5 0-6-1-7.5-3"/><path d="M4 20l7-7"/><path d="M11.5 8.5c-3-1-5-3-5-6 3.5 0 6 1 7.5 3"/><path d="M20 4l-7 7"/></svg></div>Mine</a>
  <a href="wallet.html" style="font-size:11px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:4px;"><div style="width:22px; height:22px; display:flex; align-items:center; justify-content:center;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="0.6" fill="currentColor" stroke="none"/></svg></div>Wallet</a>
  <a href="referrals.html" style="font-size:11px; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:4px;"><div style="width:22px; height:22px; display:flex; align-items:center; justify-content:center;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l1.93-1.93a5 5 0 0 0-7.07-7.07L10.5 5.5"/><path d="M14 11a5 5 0 0 0-7.07 0L5 12.93a5 5 0 0 0 7.07 7.07L13.5 18.5"/></svg></div>Referrals</a>
  <a href="profile.html" style="font-size:11px; color:var(--indigo-soft); display:flex; flex-direction:column; align-items:center; gap:4px;"><div style="width:22px; height:22px; display:flex; align-items:center; justify-content:center;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg></div>Profile</a>
</nav>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  let currentUser = null;

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await auth.signOut();
    window.location.href = 'login.html';
  });

  document.getElementById('changePwd').addEventListener('click', async () => {
    const msg = document.getElementById('msg');
    msg.textContent = '';
    try {
      await auth.sendPasswordResetEmail(currentUser.email);
      msg.textContent = 'Password reset link sent to your email.';
      msg.className = 'msg ok';
    } catch (err) {
      msg.textContent = 'Ooh, that hit an iceberg 🧊 — give it another try!';
      msg.className = 'msg err';
    }
  });

  requireAuth(async (user) => {
    currentUser = user;
    try {
      const userDoc = await db.collection(COL.users).doc(user.uid).get();
      const u = userDoc.data() || {};

      document.getElementById('fullName').textContent = u.fullName || 'User';
      document.getElementById('avatarInitial').textContent = (u.fullName || 'U').charAt(0).toUpperCase();
      document.getElementById('userIdLine').textContent = u.userId || '—';
      document.getElementById('statusText').textContent = u.status || 'Active';
      document.getElementById('email').textContent = u.email || '—';
      document.getElementById('phone').textContent = u.phone || '—';
      document.getElementById('refCode').textContent = u.referralCode || '—';
      document.getElementById('createdAt').textContent = u.createdAt
        ? u.createdAt.toDate().toLocaleDateString('en-PK', { day: 'numeric', month: 'short', year: 'numeric' })
        : '—';

      const subQuery = await db.collection(COL.subscriptions)
        .where('userId', '==', user.uid).where('status', '==', 'Active').limit(1).get();
      if (!subQuery.empty) {
        document.getElementById('subPlan').textContent = subQuery.docs[0].data().planName || 'Active';
      }
    } catch (err) {
      console.error(err);
    }
  });
</script>
</body>
</html>

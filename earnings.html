<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Earnings — EarnNova</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E1F; --surface:rgba(255,255,255,0.045); --surface-border:rgba(255,255,255,0.09);
    --text:#EDEFF7; --muted:#8D94B8; --indigo:#5B6EF5; --indigo-soft:#818CF8; --teal:#22D3B8; --danger:#F26B6B;
    --radius:18px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:radial-gradient(circle at 15% 0%, rgba(91,110,245,0.16), transparent 45%), var(--bg);
    color:var(--text); font-family:'Inter', sans-serif; padding-bottom:40px;
  }
  h1,.brand{font-family:'Sora', sans-serif;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:760px; margin:0 auto; padding:0 18px;}

  header{
    position:sticky; top:0; z-index:50; backdrop-filter:blur(14px);
    background:rgba(10,14,31,0.75); border-bottom:1px solid var(--surface-border);
  }
  .nav{display:flex; align-items:center; gap:14px; padding:14px 18px; max-width:760px; margin:0 auto;}
  .back{font-size:18px;}
  .nav h1{font-size:17px; font-weight:700;}

  .stat-row{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:18px;}
  .stat-card{background:var(--surface); border:1px solid var(--surface-border); border-radius:14px; padding:14px 10px; text-align:center;}
  .stat-card .v{font-family:'Sora'; font-size:16px; font-weight:700;}
  .stat-card .l{color:var(--muted); font-size:10.5px; margin-top:4px;}

  .filter-row{display:flex; gap:8px; overflow-x:auto; margin-top:16px; padding-bottom:4px;}
  .filter-chip{
    flex-shrink:0; padding:8px 14px; border-radius:999px; font-size:12.5px; font-weight:600;
    border:1px solid var(--surface-border); background:var(--surface); color:var(--muted); cursor:pointer;
  }
  .filter-chip.active{background:rgba(91,110,245,0.16); border-color:rgba(91,110,245,0.4); color:var(--indigo-soft);}

  .list{display:flex; flex-direction:column; gap:8px; margin-top:16px;}
  .item{
    background:var(--surface); border:1px solid var(--surface-border); border-radius:14px; padding:14px;
  }
  .item-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .item-title{font-size:13.5px; font-weight:700;}
  .item-sub{color:var(--muted); font-size:11px; margin-top:3px;}
  .item-reward{font-family:'Sora'; font-weight:700; font-size:14px; color:var(--teal); white-space:nowrap;}
  .item-status{display:inline-block; margin-top:8px; padding:4px 10px; border-radius:999px; font-size:10px; font-weight:700;}
  .item-status.Submitted, .item-status.Under_Review{background:rgba(91,110,245,0.14); color:var(--indigo-soft);}
  .item-status.Approved{background:rgba(34,211,184,0.14); color:var(--teal);}
  .item-status.Rejected{background:rgba(242,107,107,0.14); color:var(--danger);}
  .rej-reason{font-size:11.5px; color:var(--danger); margin-top:6px;}

  .empty{color:var(--muted); font-size:13.5px; text-align:center; padding:30px 0;}
</style>
</head>
<body>

<header>
  <div class="nav">
    <a class="back" href="tasks.html">←</a>
    <h1>My Earnings</h1>
  </div>
</header>

<div class="wrap">

  <div class="stat-row">
    <div class="stat-card"><div class="v" id="totalCount">0</div><div class="l">Total Submissions</div></div>
    <div class="stat-card"><div class="v" id="approvedCount">0</div><div class="l">Approved</div></div>
    <div class="stat-card"><div class="v" id="approvedAmt">PKR 0</div><div class="l">Earned</div></div>
  </div>

  <div class="filter-row" id="filterRow">
    <div class="filter-chip active" data-status="all">All</div>
    <div class="filter-chip" data-status="pending">Pending</div>
    <div class="filter-chip" data-status="Approved">Approved</div>
    <div class="filter-chip" data-status="Rejected">Rejected</div>
  </div>

  <div class="list" id="list">
    <div class="empty">Loading...</div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  function fmt(n) { return 'PKR ' + Number(n || 0).toLocaleString('en-PK'); }

  let allSubs = [];

  function render(status) {
    const listEl = document.getElementById('list');
    let rows = allSubs;
    if (status === 'pending') rows = allSubs.filter(s => s.status === 'Submitted' || s.status === 'Under Review');
    else if (status !== 'all') rows = allSubs.filter(s => s.status === status);

    if (rows.length === 0) {
      listEl.innerHTML = '<div class="empty">No submissions in this category.</div>';
      return;
    }

    listEl.innerHTML = '';
    rows.forEach(s => {
      const dateStr = s.createdAt ? s.createdAt.toDate().toLocaleDateString('en-PK', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
      const statusClass = (s.status || '').replace(' ', '_');
      const item = document.createElement('div');
      item.className = 'item';
      item.innerHTML = `
        <div class="item-top">
          <div>
            <div class="item-title">${s.taskTitle || 'Task'}</div>
            <div class="item-sub">${dateStr}</div>
          </div>
          <div class="item-reward">${fmt(s.reward)}</div>
        </div>
        <span class="item-status ${statusClass}">${s.status}</span>
        ${s.status === 'Rejected' && s.rejectionReason ? `<div class="rej-reason">${s.rejectionReason}</div>` : ''}
      `;
      listEl.appendChild(item);
    });
  }

  document.getElementById('filterRow').addEventListener('click', (e) => {
    const chip = e.target.closest('.filter-chip');
    if (!chip) return;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    render(chip.dataset.status);
  });

  requireAuth(async (user) => {
    try {
      const subQuery = await db.collection(COL.submissions)
        .where('userId', '==', user.uid).orderBy('createdAt', 'desc').get();
      allSubs = subQuery.docs.map(d => d.data());

      document.getElementById('totalCount').textContent = allSubs.length;
      const approved = allSubs.filter(s => s.status === 'Approved');
      document.getElementById('approvedCount').textContent = approved.length;
      const totalAmt = approved.reduce((sum, s) => sum + (s.reward || 0), 0);
      document.getElementById('approvedAmt').textContent = fmt(totalAmt);

      render('all');
    } catch (err) {
      console.error(err);
      document.getElementById('list').innerHTML = '<div class="empty">Something went wrong. Please try again.</div>';
    }
  });
</script>
</body>
</html>

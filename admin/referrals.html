<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Referrals — EarnNova Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E1F; --surface:rgba(255,255,255,0.045); --surface-border:rgba(255,255,255,0.09);
    --text:#EDEFF7; --muted:#8D94B8; --indigo:#5B6EF5; --indigo-soft:#818CF8; --teal:#22D3B8; --danger:#F26B6B;
    --radius:18px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:radial-gradient(circle at 15% 0%, rgba(91,110,245,0.16), transparent 45%), var(--bg);
    color:var(--text); font-family:'Inter', sans-serif; padding-bottom:40px;
  }
  h1,h2,.brand{font-family:'Sora', sans-serif;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:700px; margin:0 auto; padding:0 18px;}

  header{
    position:sticky; top:0; z-index:50; backdrop-filter:blur(14px);
    background:rgba(10,14,31,0.75); border-bottom:1px solid var(--surface-border);
  }
  .nav{display:flex; align-items:center; gap:14px; padding:14px 18px; max-width:700px; margin:0 auto;}
  .back{font-size:18px;}
  .nav h1{font-size:16px; font-weight:700;}

  .card{background:var(--surface); border:1px solid var(--surface-border); border-radius:var(--radius); padding:18px; margin-top:18px;}
  .card h2{font-size:14.5px; font-weight:700; margin-bottom:12px;}
  label{font-size:12.5px; color:var(--muted); display:block; margin-bottom:6px;}
  input{
    width:100%; background:rgba(255,255,255,0.04); border:1px solid var(--surface-border);
    border-radius:12px; padding:11px 13px; color:var(--text); font-size:13.5px; outline:none;
  }
  button{
    width:100%; margin-top:14px; padding:12px; border:none; border-radius:12px; font-weight:600; font-size:14px;
    background:linear-gradient(135deg, var(--indigo), #4756D8); color:#fff; cursor:pointer;
  }
  button:disabled{opacity:0.6;}
  .msg{font-size:12.5px; margin-top:10px; text-align:center; min-height:16px;}
  .msg.ok{color:var(--teal);}
  .msg.err{color:var(--danger);}

  .stat-row{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;}
  .stat-card{background:var(--surface); border:1px solid var(--surface-border); border-radius:14px; padding:14px;}
  .stat-card .label{color:var(--muted); font-size:11.5px;}
  .stat-card .value{font-family:'Sora'; font-size:18px; font-weight:700; margin-top:5px;}

  .list{display:flex; flex-direction:column; gap:8px; margin-top:14px;}
  .item{background:var(--surface); border:1px solid var(--surface-border); border-radius:14px; padding:13px 14px;}
  .item-top{display:flex; justify-content:space-between; align-items:center;}
  .item-name{font-size:13px; font-weight:600;}
  .item-sub{color:var(--muted); font-size:10.5px; margin-top:2px;}
  .item-status{font-size:10px; font-weight:700; padding:3px 9px; border-radius:999px;}
  .item-status.Registered{background:rgba(91,110,245,0.14); color:var(--indigo-soft);}
  .item-status.Active, .item-status.Verified{background:rgba(34,211,184,0.14); color:var(--teal);}
  .empty{color:var(--muted); font-size:13.5px; text-align:center; padding:24px 0;}

  /* ===== Glacier animated background + glass motion ===== */
  .glacier-bg{ position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
  .glacier-bg span{ position:absolute; border-radius:50%; filter:blur(70px); opacity:0.32; will-change:transform; }
  .glacier-bg span:nth-child(1){ width:280px; height:280px; background:#5B6EF5; top:-90px; left:-70px; animation:glacierFloat1 22s ease-in-out infinite; }
  .glacier-bg span:nth-child(2){ width:240px; height:240px; background:#22D3B8; top:35%; right:-90px; animation:glacierFloat2 26s ease-in-out infinite; }
  .glacier-bg span:nth-child(3){ width:220px; height:220px; background:#818CF8; bottom:-80px; left:25%; animation:glacierFloat3 20s ease-in-out infinite; }
  @keyframes glacierFloat1{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(30px,40px) scale(1.12);} }
  @keyframes glacierFloat2{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-35px,-25px) scale(1.08);} }
  @keyframes glacierFloat3{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(25px,-35px) scale(1.1);} }

  @keyframes glassFadeUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  .card, .stat-card, .main-card, .task-card, .item, .hero-card, .bal-card, .balance-card,
  .activity-item, .method, .plan, .cat-card, .step, .meta-card, .sub-card, .head-card,
  .ref-item, .menu-item, .note, .confirm-box, .status-banner, .search-box, .task-details-card,
  .rig-card, .progress-card, .power-note, .disclaimer, .h-item, .row, .current-card{
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    animation: glassFadeUp 0.55s cubic-bezier(.2,.7,.3,1) both;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .card:active, .stat-card:active, .item:active, .task-card:active,
  .activity-item:active, .method:active, .ref-item:active, .menu-item:active, .h-item:active{
    transform: scale(0.98);
  }
  a.task-card:hover, a.activity-item:hover, .menu-item:hover{
    border-color: rgba(91,110,245,0.4);
    box-shadow: 0 8px 30px rgba(91,110,245,0.12);
  }

  /* Glass shimmer sweep on the big hero-style panels */
  .hero-card, .bal-card, .balance-card, .main-card.wide, .head-card, .rig-card{
    position: relative;
    overflow: hidden;
  }
  .hero-card::before, .bal-card::before, .balance-card::before, .main-card.wide::before, .head-card::before, .rig-card::before{
    content: '';
    position: absolute;
    top: 0; left: -60%;
    width: 50%; height: 100%;
    background: linear-gradient(115deg, transparent, rgba(255,255,255,0.16), transparent);
    transform: skewX(-18deg);
    animation: glassShimmer 5.5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes glassShimmer{
    0%{ left:-60%; }
    45%{ left:130%; }
    100%{ left:130%; }
  }

  header{
    backdrop-filter: blur(20px) saturate(160%) !important;
    -webkit-backdrop-filter: blur(20px) saturate(160%) !important;
  }

  button, .btn-primary, .btn-approve, .nav-cta{
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  button:active, .btn-primary:active{ transform: scale(0.97); }
  button:not(:disabled):hover, .btn-primary:hover{ filter: brightness(1.08); }


  /* ===== Continuous ambient glass shimmer (v2) ===== */
  .card, .stat-card, .item, .task-card, .h-item, .method, .plan, .ref-item,
  .menu-item, .row, .sub-card, .activity-item, .meta-card, .cat-card, .step{
    position: relative;
    overflow: hidden;
  }
  .card::after, .stat-card::after, .item::after, .task-card::after, .h-item::after,
  .method::after, .plan::after, .ref-item::after, .menu-item::after, .row::after,
  .sub-card::after, .activity-item::after, .meta-card::after, .cat-card::after, .step::after{
    content: '';
    position: absolute;
    top: 0; left: -70%;
    width: 40%; height: 100%;
    background: linear-gradient(115deg, transparent, rgba(255,255,255,0.07), transparent);
    transform: skewX(-18deg);
    animation: ambientShimmer 8s ease-in-out infinite;
    animation-delay: calc(var(--shimmer-delay, 0) * 1s);
    pointer-events: none;
  }
  @keyframes ambientShimmer{
    0%{ left:-70%; }
    50%{ left:140%; }
    100%{ left:140%; }
  }
  /* Stagger the shimmer across a list so cards don't all flash in unison */
  .list > *:nth-child(2n)::after, .task-list > *:nth-child(2n)::after,
  .menu-list > *:nth-child(2n)::after, .plans > *:nth-child(2n)::after{ animation-delay: 1.6s; }
  .list > *:nth-child(3n)::after, .task-list > *:nth-child(3n)::after{ animation-delay: 3.2s; }
  .list > *:nth-child(4n)::after{ animation-delay: 4.8s; }

</style>
</head>
<body>
<div class="glacier-bg"><span></span><span></span><span></span></div>

<header>
  <div class="nav">
    <a class="back" href="dashboard.html">←</a>
    <h1>Referrals</h1>
  </div>
</header>

<div class="wrap">

  <div class="card">
    <h2>Referral Commission Setting</h2>
    <label>Commission Rate (PKR per verified referral)</label>
    <input id="commissionRate" type="number" min="0" step="1">
    <button id="saveBtn">Save</button>
    <div class="msg" id="saveMsg"></div>
  </div>

  <div class="stat-row">
    <div class="stat-card"><div class="label">Total Referrals</div><div class="value" id="totalRefs">—</div></div>
    <div class="stat-card"><div class="label">Verified / Active</div><div class="value" id="activeRefs">—</div></div>
  </div>

  <div class="card">
    <h2>All Referrals</h2>
    <div class="list" id="refList"><div class="empty">Loading...</div></div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>
<script>
  document.getElementById('saveBtn').addEventListener('click', async () => {
    const msg = document.getElementById('saveMsg');
    const btn = document.getElementById('saveBtn');
    const commissionRate = parseFloat(document.getElementById('commissionRate').value) || 0;

    btn.disabled = true;
    msg.textContent = '';
    try {
      await db.collection(COL.settings).doc('referral').set({ commissionRate }, { merge: true });
      msg.textContent = 'Referral commission rate saved.';
      msg.className = 'msg ok';
    } catch (err) {
      console.error(err);
      msg.textContent = 'Failed to save. Please try again.';
      msg.className = 'msg err';
    } finally {
      btn.disabled = false;
    }
  });

  requireAdmin(async () => {
    try {
      const settingsDoc = await db.collection(COL.settings).doc('referral').get();
      document.getElementById('commissionRate').value = (settingsDoc.exists && settingsDoc.data().commissionRate) || 50;

      const refSnap = await db.collection(COL.referrals).orderBy('createdAt', 'desc').limit(100).get();
      const refs = refSnap.docs.map(d => d.data());

      document.getElementById('totalRefs').textContent = refs.length;
      document.getElementById('activeRefs').textContent = refs.filter(r => r.status === 'Active' || r.status === 'Verified').length;

      const listEl = document.getElementById('refList');
      if (refs.length === 0) {
        listEl.innerHTML = '<div class="empty">No referrals yet.</div>';
      } else {
        listEl.innerHTML = '';
        for (const r of refs) {
          const [referrerDoc, referredDoc] = await Promise.all([
            db.collection(COL.users).doc(r.referrerUid).get(),
            db.collection(COL.users).doc(r.referredUid).get()
          ]);
          const referrerName = referrerDoc.exists ? referrerDoc.data().fullName : r.referrerUid;
          const referredName = referredDoc.exists ? referredDoc.data().fullName : r.referredUid;
          const dateStr = r.createdAt ? r.createdAt.toDate().toLocaleDateString('en-PK', { day: 'numeric', month: 'short' }) : '';
          const item = document.createElement('div');
          item.className = 'item';
          item.innerHTML = `
            <div class="item-top">
              <div>
                <div class="item-name">${referrerName} → ${referredName}</div>
                <div class="item-sub">Joined ${dateStr}</div>
              </div>
              <span class="item-status ${r.status}">${r.status}</span>
            </div>
          `;
          listEl.appendChild(item);
        }
      }
    } catch (err) {
      console.error(err);
      document.getElementById('refList').innerHTML = '<div class="empty">Ooh, that hit an iceberg 🧊 — give it another try!</div>';
    }
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subscriptions — EarnNova Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E1F; --surface:rgba(255,255,255,0.045); --surface-border:rgba(255,255,255,0.09);
    --text:#EDEFF7; --muted:#8D94B8; --indigo:#5B6EF5; --indigo-soft:#818CF8; --teal:#22D3B8; --danger:#F26B6B;
    --radius:18px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:radial-gradient(circle at 15% 0%, rgba(91,110,245,0.16), transparent 45%), var(--bg);
    color:var(--text); font-family:'Inter', sans-serif; padding-bottom:40px;
  }
  h1,.brand{font-family:'Sora', sans-serif;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:700px; margin:0 auto; padding:0 18px;}

  header{
    position:sticky; top:0; z-index:50; backdrop-filter:blur(14px);
    background:rgba(10,14,31,0.75); border-bottom:1px solid var(--surface-border);
  }
  .nav{display:flex; align-items:center; gap:14px; padding:14px 18px; max-width:700px; margin:0 auto;}
  .back{font-size:18px;}
  .nav h1{font-size:16px; font-weight:700;}

  .filter-row{display:flex; gap:8px; overflow-x:auto; margin-top:16px; padding-bottom:4px;}
  .filter-chip{
    flex-shrink:0; padding:8px 14px; border-radius:999px; font-size:12.5px; font-weight:600;
    border:1px solid var(--surface-border); background:var(--surface); color:var(--muted); cursor:pointer;
  }
  .filter-chip.active{background:rgba(91,110,245,0.16); border-color:rgba(91,110,245,0.4); color:var(--indigo-soft);}

  .list{display:flex; flex-direction:column; gap:10px; margin-top:16px;}
  .item{background:var(--surface); border:1px solid var(--surface-border); border-radius:var(--radius); padding:16px;}
  .item-top{display:flex; justify-content:space-between; align-items:flex-start;}
  .item-amt{font-family:'Sora'; font-weight:800; font-size:18px; color:var(--teal);}
  .item-plan{font-size:11.5px; color:var(--indigo-soft); font-weight:600; margin-top:2px;}
  .item-status{padding:4px 10px; border-radius:999px; font-size:10.5px; font-weight:700;}
  .item-status.Pending_Verification{background:rgba(91,110,245,0.14); color:var(--indigo-soft);}
  .item-status.Active{background:rgba(34,211,184,0.14); color:var(--teal);}
  .item-status.Rejected{background:rgba(242,107,107,0.14); color:var(--danger);}
  .item-status.Expired{background:rgba(255,255,255,0.08); color:var(--muted);}

  .detail-grid{margin-top:12px; display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--muted);}
  .detail-grid b{color:var(--text);}

  .action-row{display:flex; gap:10px; margin-top:14px;}
  .action-row button{
    flex:1; padding:11px; border:none; border-radius:11px; font-weight:600; font-size:13px; cursor:pointer;
  }
  .btn-approve{background:linear-gradient(135deg, var(--teal), #0E7A38); color:#fff;}
  .btn-reject{background:rgba(242,107,107,0.14); border:1px solid rgba(242,107,107,0.3) !important; color:var(--danger);}
  button:disabled{opacity:0.5;}
  .empty{color:var(--muted); font-size:13.5px; text-align:center; padding:36px 0;}

  /* ===== Glacier animated background + glass motion ===== */
  .glacier-bg{ position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
  .glacier-bg span{ position:absolute; border-radius:50%; filter:blur(70px); opacity:0.32; will-change:transform; }
  .glacier-bg span:nth-child(1){ width:280px; height:280px; background:#5B6EF5; top:-90px; left:-70px; animation:glacierFloat1 22s ease-in-out infinite; }
  .glacier-bg span:nth-child(2){ width:240px; height:240px; background:#22D3B8; top:35%; right:-90px; animation:glacierFloat2 26s ease-in-out infinite; }
  .glacier-bg span:nth-child(3){ width:220px; height:220px; background:#818CF8; bottom:-80px; left:25%; animation:glacierFloat3 20s ease-in-out infinite; }
  @keyframes glacierFloat1{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(30px,40px) scale(1.12);} }
  @keyframes glacierFloat2{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-35px,-25px) scale(1.08);} }
  @keyframes glacierFloat3{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(25px,-35px) scale(1.1);} }

  @keyframes glassFadeUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  .card, .stat-card, .main-card, .task-card, .item, .hero-card, .bal-card, .balance-card,
  .activity-item, .method, .plan, .cat-card, .step, .meta-card, .sub-card, .head-card,
  .ref-item, .menu-item, .note, .confirm-box, .status-banner, .search-box, .task-details-card,
  .rig-card, .progress-card, .power-note, .disclaimer, .h-item, .row, .current-card{
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    animation: glassFadeUp 0.55s cubic-bezier(.2,.7,.3,1) both;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .card:active, .stat-card:active, .item:active, .task-card:active,
  .activity-item:active, .method:active, .ref-item:active, .menu-item:active, .h-item:active{
    transform: scale(0.98);
  }
  a.task-card:hover, a.activity-item:hover, .menu-item:hover{
    border-color: rgba(91,110,245,0.4);
    box-shadow: 0 8px 30px rgba(91,110,245,0.12);
  }

  /* Glass shimmer sweep on the big hero-style panels */
  .hero-card, .bal-card, .balance-card, .main-card.wide, .head-card, .rig-card{
    position: relative;
    overflow: hidden;
  }
  .hero-card::before, .bal-card::before, .balance-card::before, .main-card.wide::before, .head-card::before, .rig-card::before{
    content: '';
    position: absolute;
    top: 0; left: -60%;
    width: 50%; height: 100%;
    background: linear-gradient(115deg, transparent, rgba(255,255,255,0.16), transparent);
    transform: skewX(-18deg);
    animation: glassShimmer 5.5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes glassShimmer{
    0%{ left:-60%; }
    45%{ left:130%; }
    100%{ left:130%; }
  }

  header{
    backdrop-filter: blur(20px) saturate(160%) !important;
    -webkit-backdrop-filter: blur(20px) saturate(160%) !important;
  }

  button, .btn-primary, .btn-approve, .nav-cta{
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  button:active, .btn-primary:active{ transform: scale(0.97); }
  button:not(:disabled):hover, .btn-primary:hover{ filter: brightness(1.08); }


  /* ===== Continuous ambient glass shimmer (v2) ===== */
  .card, .stat-card, .item, .task-card, .h-item, .method, .plan, .ref-item,
  .menu-item, .row, .sub-card, .activity-item, .meta-card, .cat-card, .step{
    position: relative;
    overflow: hidden;
  }
  .card::after, .stat-card::after, .item::after, .task-card::after, .h-item::after,
  .method::after, .plan::after, .ref-item::after, .menu-item::after, .row::after,
  .sub-card::after, .activity-item::after, .meta-card::after, .cat-card::after, .step::after{
    content: '';
    position: absolute;
    top: 0; left: -70%;
    width: 40%; height: 100%;
    background: linear-gradient(115deg, transparent, rgba(255,255,255,0.07), transparent);
    transform: skewX(-18deg);
    animation: ambientShimmer 8s ease-in-out infinite;
    animation-delay: calc(var(--shimmer-delay, 0) * 1s);
    pointer-events: none;
  }
  @keyframes ambientShimmer{
    0%{ left:-70%; }
    50%{ left:140%; }
    100%{ left:140%; }
  }
  /* Stagger the shimmer across a list so cards don't all flash in unison */
  .list > *:nth-child(2n)::after, .task-list > *:nth-child(2n)::after,
  .menu-list > *:nth-child(2n)::after, .plans > *:nth-child(2n)::after{ animation-delay: 1.6s; }
  .list > *:nth-child(3n)::after, .task-list > *:nth-child(3n)::after{ animation-delay: 3.2s; }
  .list > *:nth-child(4n)::after{ animation-delay: 4.8s; }

</style>
</head>
<body>
<div class="glacier-bg"><span></span><span></span><span></span></div>

<header>
  <div class="nav">
    <a class="back" href="dashboard.html">←</a>
    <h1>Subscriptions</h1>
  </div>
</header>

<div class="wrap">
  <div class="filter-row" id="filterRow">
    <div class="filter-chip active" data-status="Pending Verification">Pending</div>
    <div class="filter-chip" data-status="Active">Active</div>
    <div class="filter-chip" data-status="Rejected">Rejected</div>
    <div class="filter-chip" data-status="all">All</div>
  </div>
  <div class="list" id="list">
    <div class="empty">Loading...</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>
<script>
  function fmt(n) { return 'PKR ' + Number(n || 0).toLocaleString('en-PK'); }
  let allSubs = [];
  let adminUid = null;

  function render(status) {
    const listEl = document.getElementById('list');
    const rows = status === 'all' ? allSubs : allSubs.filter(s => s.data.status === status);
    if (rows.length === 0) { listEl.innerHTML = '<div class="empty">No subscription requests here.</div>'; return; }
    listEl.innerHTML = '';
    rows.forEach(({ id, data: s }) => {
      const dateStr = s.createdAt ? s.createdAt.toDate().toLocaleString('en-PK', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
      const statusClass = (s.status || '').replace(/ /g, '_');
      const item = document.createElement('div');
      item.className = 'item';
      item.innerHTML = `
        <div class="item-top">
          <div>
            <div class="item-amt">${fmt(s.price)}</div>
            <div class="item-plan">${s.planName} plan · ${s.method}</div>
          </div>
          <span class="item-status ${statusClass}">${s.status}</span>
        </div>
        <div class="detail-grid">
          <div>User: <b>${s.userName || s.userId}</b></div>
          <div>Transaction ID: <b>${s.transactionId}</b></div>
          <div>Submitted: <b>${dateStr}</b></div>
        </div>
        ${s.status === 'Pending Verification' ? `
        <div class="action-row">
          <button class="btn-approve" data-action="approve" data-id="${id}">Approve & Activate</button>
          <button class="btn-reject" data-action="reject" data-id="${id}">Reject</button>
        </div>` : ''}
      `;
      listEl.appendChild(item);
    });
  }

  document.getElementById('filterRow').addEventListener('click', (e) => {
    const chip = e.target.closest('.filter-chip');
    if (!chip) return;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    render(chip.dataset.status);
  });

  document.getElementById('list').addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const id = btn.dataset.id;
    const action = btn.dataset.action;
    const sub = allSubs.find(s => s.id === id);
    if (!sub) return;

    let reason = null;
    if (action === 'reject') {
      reason = prompt('Reason for rejection (optional):') || 'Not specified';
    } else {
      if (!confirm(`Confirm that this ${fmt(sub.data.price)} payment has been manually verified.`)) return;
    }

    btn.disabled = true;
    btn.textContent = action === 'approve' ? 'Approving...' : 'Rejecting...';

    try {
      if (action === 'approve') {
        const expiresAt = Date.now() + 30 * 86400000;
        await db.collection(COL.subscriptions).doc(id).update({
          status: 'Active', startedAt: firebase.firestore.FieldValue.serverTimestamp(),
          expiresAt, approvedBy: adminUid, approvedAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        await db.collection(COL.transactions).add({
          transactionId: generateRefId('TX'),
          userId: sub.data.userId,
          type: 'Subscription',
          amount: sub.data.price,
          status: 'Approved',
          reference: id,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          createdBy: adminUid
        });

        await db.collection(COL.notifications).add({
          userId: sub.data.userId, title: 'Subscription activated',
          message: `Your ${sub.data.planName} plan has been activated for 30 days.`,
          read: false, createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      } else {
        await db.collection(COL.subscriptions).doc(id).update({
          status: 'Rejected', rejectionReason: reason, reviewedBy: adminUid, reviewedAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        await db.collection(COL.notifications).add({
          userId: sub.data.userId, title: 'Subscription payment rejected',
          message: `Your ${sub.data.planName} plan payment was rejected. Reason: ${reason}`,
          read: false, createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }

      await db.collection(COL.adminLogs).add({
        adminId: adminUid, action: action === 'approve' ? 'Subscription activated' : 'Subscription rejected',
        targetUserId: sub.data.userId, amount: sub.data.price, reference: id,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      location.reload();
    } catch (err) {
      console.error(err);
      alert('Ooh, that hit an iceberg 🧊 — give it another try!');
      btn.disabled = false;
      btn.textContent = action === 'approve' ? 'Approve & Activate' : 'Reject';
    }
  });

  requireAdmin(async (user) => {
    adminUid = user.uid;
    try {
      const snap = await db.collection(COL.subscriptions).orderBy('createdAt', 'desc').get();
      allSubs = [];
      for (const doc of snap.docs) {
        const d = doc.data();
        const userDoc = await db.collection(COL.users).doc(d.userId).get();
        d.userName = userDoc.exists ? userDoc.data().fullName : d.userId;
        allSubs.push({ id: doc.id, data: d });
      }
      render('Pending Verification');
    } catch (err) {
      console.error(err);
      document.getElementById('list').innerHTML = '<div class="empty">Ooh, that hit an iceberg 🧊 — give it another try!</div>';
    }
  });
</script>
</body>
</html>

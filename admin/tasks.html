<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks & Submissions — EarnNova Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E1F; --surface:rgba(255,255,255,0.045); --surface-border:rgba(255,255,255,0.09);
    --text:#EDEFF7; --muted:#8D94B8; --indigo:#5B6EF5; --indigo-soft:#818CF8; --teal:#22D3B8; --danger:#F26B6B;
    --radius:18px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:radial-gradient(circle at 15% 0%, rgba(91,110,245,0.16), transparent 45%), var(--bg);
    color:var(--text); font-family:'Inter', sans-serif; padding-bottom:40px;
  }
  h1,h2,.brand{font-family:'Sora', sans-serif;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:700px; margin:0 auto; padding:0 18px;}

  header{
    position:sticky; top:0; z-index:50; backdrop-filter:blur(14px);
    background:rgba(10,14,31,0.75); border-bottom:1px solid var(--surface-border);
  }
  .nav{display:flex; align-items:center; gap:14px; padding:14px 18px; max-width:700px; margin:0 auto;}
  .back{font-size:18px;}
  .nav h1{font-size:16px; font-weight:700;}

  .tabs{display:flex; gap:8px; margin-top:18px;}
  .tab{flex:1; text-align:center; padding:11px; border-radius:12px; font-size:13px; font-weight:600; cursor:pointer; border:1px solid var(--surface-border); background:var(--surface); color:var(--muted);}
  .tab.active{background:rgba(91,110,245,0.16); border-color:rgba(91,110,245,0.4); color:var(--indigo-soft);}

  .panel{display:none; margin-top:16px;}
  .panel.active{display:block;}

  .card{background:var(--surface); border:1px solid var(--surface-border); border-radius:var(--radius); padding:18px;}
  label{font-size:12.5px; color:var(--muted); display:block; margin-bottom:6px; margin-top:12px;}
  input, textarea, select{
    width:100%; background:rgba(255,255,255,0.04); border:1px solid var(--surface-border);
    border-radius:12px; padding:11px 13px; color:var(--text); font-size:13.5px; outline:none; font-family:inherit;
  }
  textarea{min-height:70px; resize:vertical;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  button{
    width:100%; margin-top:16px; padding:12px; border:none; border-radius:12px; font-weight:600; font-size:14px;
    background:linear-gradient(135deg, var(--indigo), #4756D8); color:#fff; cursor:pointer;
  }
  button:disabled{opacity:0.6;}
  .msg{font-size:12.5px; margin-top:10px; text-align:center; min-height:16px;}
  .msg.ok{color:var(--teal);}
  .msg.err{color:var(--danger);}

  .list{display:flex; flex-direction:column; gap:10px;}
  .item{background:var(--surface); border:1px solid var(--surface-border); border-radius:var(--radius); padding:16px;}
  .item-top{display:flex; justify-content:space-between; align-items:flex-start;}
  .item-title{font-size:14px; font-weight:700;}
  .item-reward{font-family:'Sora'; font-weight:800; font-size:15px; color:var(--teal);}
  .item-sub{color:var(--muted); font-size:11.5px; margin-top:4px;}
  .proof-box{margin-top:10px; background:rgba(255,255,255,0.03); border:1px solid var(--surface-border); border-radius:10px; padding:10px; font-size:12.5px; line-height:1.5; word-break:break-word;}
  .action-row{display:flex; gap:10px; margin-top:12px;}
  .action-row button{flex:1; margin-top:0; padding:10px; font-size:12.5px;}
  .btn-approve{background:linear-gradient(135deg, var(--teal), #0E7A38);}
  .btn-reject{background:rgba(242,107,107,0.14); border:1px solid rgba(242,107,107,0.3) !important; color:var(--danger);}
  .empty{color:var(--muted); font-size:13.5px; text-align:center; padding:30px 0;}

  /* ===== Glacier animated background + glass motion ===== */
  .glacier-bg{ position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
  .glacier-bg span{ position:absolute; border-radius:50%; filter:blur(70px); opacity:0.32; will-change:transform; }
  .glacier-bg span:nth-child(1){ width:280px; height:280px; background:#5B6EF5; top:-90px; left:-70px; animation:glacierFloat1 22s ease-in-out infinite; }
  .glacier-bg span:nth-child(2){ width:240px; height:240px; background:#22D3B8; top:35%; right:-90px; animation:glacierFloat2 26s ease-in-out infinite; }
  .glacier-bg span:nth-child(3){ width:220px; height:220px; background:#818CF8; bottom:-80px; left:25%; animation:glacierFloat3 20s ease-in-out infinite; }
  @keyframes glacierFloat1{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(30px,40px) scale(1.12);} }
  @keyframes glacierFloat2{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-35px,-25px) scale(1.08);} }
  @keyframes glacierFloat3{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(25px,-35px) scale(1.1);} }

  @keyframes glassFadeUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  .card, .stat-card, .main-card, .task-card, .item, .hero-card, .bal-card,
  .activity-item, .method, .plan, .cat-card, .step, .meta-card, .sub-card,
  .ref-item, .menu-item, .task-details-card{
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    animation: glassFadeUp 0.55s cubic-bezier(.2,.7,.3,1) both;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .card:active, .stat-card:active, .item:active, .task-card:active,
  .activity-item:active, .method:active, .ref-item:active, .menu-item:active{
    transform: scale(0.98);
  }
  a.task-card:hover, a.activity-item:hover, .menu-item:hover{
    border-color: rgba(91,110,245,0.4);
    box-shadow: 0 8px 30px rgba(91,110,245,0.12);
  }
  button, .btn-primary, .btn-approve, .nav-cta{
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  button:active, .btn-primary:active{ transform: scale(0.97); }

</style>
</head>
<body>
<div class="glacier-bg"><span></span><span></span><span></span></div>

<header>
  <div class="nav">
    <a class="back" href="dashboard.html">←</a>
    <h1>Tasks & Submissions</h1>
  </div>
</header>

<div class="wrap">

  <div class="tabs">
    <div class="tab active" data-panel="submissions">Review Submissions</div>
    <div class="tab" data-panel="create">Create Task</div>
  </div>

  <div class="panel active" id="panel-submissions">
    <div class="list" id="subList">
      <div class="empty">Loading...</div>
    </div>
  </div>

  <div class="panel" id="panel-create">
    <div class="card">
      <label>Title</label>
      <input id="t-title" placeholder="e.g. Write a 300-word product review">
      <label>Category</label>
      <select id="t-category">
        <option>Micro Tasks</option>
        <option>Content Tasks</option>
        <option>Research Tasks</option>
        <option>Digital Tasks</option>
        <option>Design Tasks</option>
        <option>Promotional Campaigns</option>
        <option>Affiliate Tasks</option>
        <option>Freelance Jobs</option>
      </select>
      <label>Description</label>
      <textarea id="t-desc" placeholder="What is this task about?"></textarea>
      <label>Instructions</label>
      <textarea id="t-instructions" placeholder="Step-by-step instructions"></textarea>
      <label>Requirements (optional)</label>
      <input id="t-requirements" placeholder="e.g. Android phone required">
      <div class="row2">
        <div><label>User Reward (PKR)</label><input id="t-reward" type="number" min="1"></div>
        <div><label>Client Budget (PKR, optional)</label><input id="t-budget" type="number" min="1" placeholder="For freelance jobs"></div>
      </div>
      <div class="row2">
        <div><label>Estimated Time</label><input id="t-time" placeholder="e.g. 15 min"></div>
        <div><label>Deadline (days from now)</label><input id="t-deadline" type="number" min="1" value="7"></div>
      </div>
      <label>Difficulty (optional)</label>
      <select id="t-difficulty">
        <option value="">—</option>
        <option>Easy</option>
        <option>Medium</option>
        <option>Hard</option>
      </select>
      <div class="msg" id="createMsg"></div>
      <button id="createBtn">Create Task</button>
    </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>
<script>
  function fmt(n) { return 'PKR ' + Number(n || 0).toLocaleString('en-PK'); }
  let allSubs = [];
  let adminUid = null;

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
    });
  });

  function renderSubs() {
    const listEl = document.getElementById('subList');
    if (allSubs.length === 0) {
      listEl.innerHTML = '<div class="empty">No submissions waiting for review.</div>';
      return;
    }
    listEl.innerHTML = '';
    allSubs.forEach(({ id, data: s }) => {
      const dateStr = s.createdAt ? s.createdAt.toDate().toLocaleString('en-PK', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
      const item = document.createElement('div');
      item.className = 'item';
      item.innerHTML = `
        <div class="item-top">
          <div>
            <div class="item-title">${s.taskTitle}</div>
            <div class="item-sub">${s.userName || s.userId} · ${dateStr}</div>
          </div>
          <div class="item-reward">${fmt(s.reward)}</div>
        </div>
        <div class="proof-box">${s.proof}</div>
        <div class="action-row">
          <button class="btn-approve" data-action="approve" data-id="${id}">Approve</button>
          <button class="btn-reject" data-action="reject" data-id="${id}">Reject</button>
        </div>
      `;
      listEl.appendChild(item);
    });
  }

  document.getElementById('subList').addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const id = btn.dataset.id;
    const action = btn.dataset.action;
    const sub = allSubs.find(s => s.id === id);
    if (!sub) return;

    let reason = null;
    if (action === 'reject') {
      reason = prompt('Reason for rejection:');
      if (reason === null) return;
    }

    btn.disabled = true;
    btn.textContent = action === 'approve' ? 'Approving...' : 'Rejecting...';

    try {
      if (action === 'approve') {
        const walletRef = db.collection(COL.wallets).doc(sub.data.userId);
        const walletDoc = await walletRef.get();
        const w = walletDoc.data() || { availableBalance: 0, pendingEarnings: 0, totalEarned: 0 };

        const newAvailable = (w.availableBalance || 0) + sub.data.reward;
        const newTotalEarned = (w.totalEarned || 0) + sub.data.reward;
        await walletRef.update({
          availableBalance: newAvailable,
          totalEarned: newTotalEarned,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        await db.collection(COL.transactions).add({
          transactionId: generateRefId('TX'),
          userId: sub.data.userId,
          type: 'Task Reward',
          amount: sub.data.reward,
          previousBalance: w.availableBalance || 0,
          newBalance: newAvailable,
          reference: sub.data.taskId,
          status: 'Approved',
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          createdBy: adminUid
        });

        await db.collection(COL.submissions).doc(id).update({ status: 'Approved', reviewedBy: adminUid, reviewedAt: firebase.firestore.FieldValue.serverTimestamp() });

        await db.collection(COL.notifications).add({
          userId: sub.data.userId, title: 'Task approved',
          message: `"${sub.data.taskTitle}" was approved. ${fmt(sub.data.reward)} added to your balance.`,
          read: false, createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      } else {
        await db.collection(COL.submissions).doc(id).update({
          status: 'Rejected', rejectionReason: reason || 'Not specified', reviewedBy: adminUid, reviewedAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        await db.collection(COL.notifications).add({
          userId: sub.data.userId, title: 'Task rejected',
          message: `"${sub.data.taskTitle}" was rejected. Reason: ${reason || 'Not specified'}`,
          read: false, createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }

      await db.collection(COL.adminLogs).add({
        adminId: adminUid, action: action === 'approve' ? 'Task approved' : 'Task rejected',
        targetUserId: sub.data.userId, amount: sub.data.reward, reference: sub.data.taskId,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      location.reload();
    } catch (err) {
      console.error(err);
      alert('Ooh, that hit an iceberg 🧊 — give it another try!');
      btn.disabled = false;
      btn.textContent = action === 'approve' ? 'Approve' : 'Reject';
    }
  });

  document.getElementById('createBtn').addEventListener('click', async () => {
    const msg = document.getElementById('createMsg');
    msg.textContent = '';

    const title = document.getElementById('t-title').value.trim();
    const category = document.getElementById('t-category').value;
    const description = document.getElementById('t-desc').value.trim();
    const instructions = document.getElementById('t-instructions').value.trim();
    const requirements = document.getElementById('t-requirements').value.trim();
    const reward = parseFloat(document.getElementById('t-reward').value);
    const clientBudget = parseFloat(document.getElementById('t-budget').value) || null;
    const estimatedTime = document.getElementById('t-time').value.trim();
    const deadlineDays = parseInt(document.getElementById('t-deadline').value) || 7;
    const difficulty = document.getElementById('t-difficulty').value;

    if (!title || !description || !reward) { msg.textContent = 'Title, description and reward are required.'; msg.className = 'msg err'; return; }
    if (clientBudget && clientBudget < reward) { msg.textContent = 'Client budget cannot be less than the user reward.'; msg.className = 'msg err'; return; }

    const btn = document.getElementById('createBtn');
    btn.disabled = true;
    btn.textContent = 'Creating...';

    try {
      await db.collection(COL.tasks).add({
        title, category, description, instructions,
        requirements: requirements || null,
        reward, clientBudget,
        estimatedTime: estimatedTime || null,
        deadline: Date.now() + deadlineDays * 86400000,
        difficulty: difficulty || null,
        status: 'Available',
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        createdBy: adminUid
      });
      msg.textContent = 'Task created and now live in Earn Now.';
      msg.className = 'msg ok';
      document.querySelectorAll('#panel-create input, #panel-create textarea').forEach(el => el.value = '');
    } catch (err) {
      console.error(err);
      msg.textContent = 'Failed to create task. Please try again.';
      msg.className = 'msg err';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Create Task';
    }
  });

  requireAdmin(async (user) => {
    adminUid = user.uid;
    try {
      const subSnap = await db.collection(COL.submissions).where('status', 'in', ['Submitted', 'Under Review']).get();
      allSubs = [];
      for (const doc of subSnap.docs) {
        const s = doc.data();
        const userDoc = await db.collection(COL.users).doc(s.userId).get();
        s.userName = userDoc.exists ? userDoc.data().fullName : s.userId;
        allSubs.push({ id: doc.id, data: s });
      }
      renderSubs();
    } catch (err) {
      console.error(err);
      document.getElementById('subList').innerHTML = '<div class="empty">Ooh, that hit an iceberg 🧊 — give it another try!</div>';
    }
  });
</script>
</body>
</html>

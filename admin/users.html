<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users — EarnNova Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E1F; --surface:rgba(255,255,255,0.045); --surface-border:rgba(255,255,255,0.09);
    --text:#EDEFF7; --muted:#8D94B8; --indigo:#5B6EF5; --indigo-soft:#818CF8; --teal:#22D3B8; --danger:#F26B6B;
    --radius:18px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:radial-gradient(circle at 15% 0%, rgba(91,110,245,0.16), transparent 45%), var(--bg);
    color:var(--text); font-family:'Inter', sans-serif; padding-bottom:40px;
  }
  h1,.brand{font-family:'Sora', sans-serif;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:700px; margin:0 auto; padding:0 18px;}

  header{
    position:sticky; top:0; z-index:50; backdrop-filter:blur(14px);
    background:rgba(10,14,31,0.75); border-bottom:1px solid var(--surface-border);
  }
  .nav{display:flex; align-items:center; gap:14px; padding:14px 18px; max-width:700px; margin:0 auto;}
  .back{font-size:18px;}
  .nav h1{font-size:16px; font-weight:700;}

  .search-box{
    margin-top:16px; display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--surface-border); border-radius:14px; padding:12px 14px;
  }
  .search-box input{background:none; border:none; outline:none; color:var(--text); font-size:14px; flex:1;}
  .search-box input::placeholder{color:var(--muted);}

  .list{display:flex; flex-direction:column; gap:8px; margin-top:16px;}
  .item{background:var(--surface); border:1px solid var(--surface-border); border-radius:14px; padding:14px;}
  .item-top{display:flex; justify-content:space-between; align-items:flex-start;}
  .item-name{font-size:13.5px; font-weight:700;}
  .item-sub{color:var(--muted); font-size:11px; margin-top:3px;}
  .status-pill{font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:999px;}
  .status-pill.Active{background:rgba(34,211,184,0.14); color:var(--teal);}
  .status-pill.Suspended{background:rgba(242,107,107,0.14); color:var(--danger);}
  .toggle-btn{margin-top:10px; width:100%; padding:9px; border-radius:10px; font-size:12px; font-weight:600; border:1px solid var(--surface-border); background:rgba(255,255,255,0.05);}
  .empty{color:var(--muted); font-size:13.5px; text-align:center; padding:30px 0;}

  /* ===== Glacier animated background + glass motion ===== */
  .glacier-bg{ position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
  .glacier-bg span{ position:absolute; border-radius:50%; filter:blur(70px); opacity:0.32; will-change:transform; }
  .glacier-bg span:nth-child(1){ width:280px; height:280px; background:#5B6EF5; top:-90px; left:-70px; animation:glacierFloat1 22s ease-in-out infinite; }
  .glacier-bg span:nth-child(2){ width:240px; height:240px; background:#22D3B8; top:35%; right:-90px; animation:glacierFloat2 26s ease-in-out infinite; }
  .glacier-bg span:nth-child(3){ width:220px; height:220px; background:#818CF8; bottom:-80px; left:25%; animation:glacierFloat3 20s ease-in-out infinite; }
  @keyframes glacierFloat1{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(30px,40px) scale(1.12);} }
  @keyframes glacierFloat2{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-35px,-25px) scale(1.08);} }
  @keyframes glacierFloat3{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(25px,-35px) scale(1.1);} }

  @keyframes glassFadeUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

  /* Lightweight cards (lists/repeated items) — fade-in only, NO blur (keeps scrolling smooth) */
  .stat-card, .item, .task-card, .activity-item, .method, .plan, .cat-card, .step,
  .meta-card, .sub-card, .ref-item, .menu-item, .h-item, .row{
    animation: glassFadeUp 0.4s ease both;
    transition: transform 0.15s ease, border-color 0.2s ease;
  }
  .stat-card:active, .item:active, .task-card:active, .activity-item:active,
  .method:active, .ref-item:active, .menu-item:active, .h-item:active{
    transform: scale(0.98);
  }
  a.task-card:hover, a.activity-item:hover, .menu-item:hover{
    border-color: rgba(91,110,245,0.4);
  }

  /* Prominent panels only — this is where the blur/glass look actually shows */
  .card, .main-card, .hero-card, .bal-card, .balance-card, .head-card, .note,
  .confirm-box, .status-banner, .search-box, .task-details-card, .rig-card,
  .progress-card, .power-note, .disclaimer, .current-card, .reply-box{
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    animation: glassFadeUp 0.5s cubic-bezier(.2,.7,.3,1) both;
  }

  /* Glass shimmer sweep on the big hero-style panels */
  .hero-card, .bal-card, .balance-card, .main-card.wide, .head-card{
    position: relative;
    overflow: hidden;
  }
  .hero-card::before, .bal-card::before, .balance-card::before, .main-card.wide::before, .head-card::before{
    content: '';
    position: absolute;
    top: 0; left: -60%;
    width: 50%; height: 100%;
    background: linear-gradient(115deg, transparent, rgba(255,255,255,0.16), transparent);
    transform: skewX(-18deg);
    animation: glassShimmer 5.5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes glassShimmer{
    0%{ left:-60%; }
    45%{ left:130%; }
    100%{ left:130%; }
  }

  header{
    backdrop-filter: blur(20px) saturate(160%) !important;
    -webkit-backdrop-filter: blur(20px) saturate(160%) !important;
  }

  button, .btn-primary, .btn-approve, .nav-cta{
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  button:active, .btn-primary:active{ transform: scale(0.97); }
  button:not(:disabled):hover, .btn-primary:hover{ filter: brightness(1.08); }

</style>
</head>
<body>
<div class="glacier-bg"><span></span><span></span><span></span></div>

<header>
  <div class="nav">
    <a class="back" href="dashboard.html">←</a>
    <h1>Users</h1>
  </div>
</header>

<div class="wrap">
  <div class="search-box">
    <span>🔎</span>
    <input id="searchInput" type="text" placeholder="Search by name, email or user ID">
  </div>
  <div class="list" id="list">
    <div class="empty">Loading...</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>
<script>
  let allUsers = [];
  let adminUid = null;

  function render() {
    const listEl = document.getElementById('list');
    const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();
    let rows = allUsers;
    if (searchVal) {
      rows = rows.filter(({ data: u }) =>
        (u.fullName || '').toLowerCase().includes(searchVal) ||
        (u.email || '').toLowerCase().includes(searchVal) ||
        (u.userId || '').toLowerCase().includes(searchVal)
      );
    }
    if (rows.length === 0) {
      listEl.innerHTML = '<div class="empty">No users found.</div>';
      return;
    }
    listEl.innerHTML = '';
    rows.forEach(({ id, data: u }) => {
      const isSuspended = u.status === 'Suspended';
      const item = document.createElement('div');
      item.className = 'item';
      item.innerHTML = `
        <div class="item-top">
          <div>
            <div class="item-name">${u.fullName || 'User'}</div>
            <div class="item-sub">${u.userId} · ${u.email} · ${u.phone || ''}</div>
          </div>
          <span class="status-pill ${u.status}">${u.status || 'Active'}</span>
        </div>
        ${u.role === 'admin' ? '' : `<button class="toggle-btn" data-id="${id}" data-current="${u.status || 'Active'}">${isSuspended ? 'Activate Account' : 'Suspend Account'}</button>`}
      `;
      listEl.appendChild(item);
    });
  }

  document.getElementById('searchInput').addEventListener('input', render);

  document.getElementById('list').addEventListener('click', async (e) => {
    const btn = e.target.closest('.toggle-btn');
    if (!btn) return;
    const id = btn.dataset.id;
    const current = btn.dataset.current;
    const newStatus = current === 'Suspended' ? 'Active' : 'Suspended';

    if (!confirm(`Set this account to "${newStatus}"?`)) return;
    btn.disabled = true;

    try {
      await db.collection(COL.users).doc(id).update({ status: newStatus });
      await db.collection(COL.adminLogs).add({
        adminId: adminUid, action: newStatus === 'Suspended' ? 'User suspended' : 'User activated',
        targetUserId: id, createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      location.reload();
    } catch (err) {
      console.error(err);
      alert('Ooh, that hit an iceberg 🧊 — give it another try!');
      btn.disabled = false;
    }
  });

  requireAdmin(async (user) => {
    adminUid = user.uid;
    try {
      const snap = await db.collection(COL.users).orderBy('createdAt', 'desc').get();
      allUsers = snap.docs.map(d => ({ id: d.id, data: d.data() }));
      render();
    } catch (err) {
      console.error(err);
      document.getElementById('list').innerHTML = '<div class="empty">Ooh, that hit an iceberg 🧊 — give it another try!</div>';
    }
  });
</script>
</body>
</html>

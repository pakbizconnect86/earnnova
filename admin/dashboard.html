<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — EarnNova</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E1F; --surface:rgba(255,255,255,0.045); --surface-border:rgba(255,255,255,0.09);
    --text:#EDEFF7; --muted:#8D94B8; --indigo:#5B6EF5; --indigo-soft:#818CF8; --teal:#22D3B8; --danger:#F26B6B;
    --radius:18px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:radial-gradient(circle at 15% 0%, rgba(91,110,245,0.16), transparent 45%), var(--bg);
    color:var(--text); font-family:'Inter', sans-serif; padding-bottom:40px;
  }
  h1,h2,.brand{font-family:'Sora', sans-serif;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:760px; margin:0 auto; padding:0 18px;}

  header{
    position:sticky; top:0; z-index:50; backdrop-filter:blur(14px);
    background:rgba(10,14,31,0.75); border-bottom:1px solid var(--surface-border);
  }
  .nav{display:flex; align-items:center; justify-content:space-between; padding:14px 18px; max-width:760px; margin:0 auto;}
  .brand{font-weight:700; font-size:18px;}
  .brand span{color:var(--indigo-soft);}
  .admin-tag{font-size:10.5px; font-weight:700; color:var(--teal); background:rgba(34,211,184,0.14); padding:4px 10px; border-radius:999px;}

  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:20px;}
  .stat-card{background:var(--surface); border:1px solid var(--surface-border); border-radius:var(--radius); padding:16px;}
  .stat-card .label{color:var(--muted); font-size:12px;}
  .stat-card .value{font-family:'Sora'; font-size:22px; font-weight:700; margin-top:6px;}
  .stat-card.alert .value{color:var(--danger);}

  .section-head{margin-top:26px; margin-bottom:12px;}
  .section-head h2{font-size:15.5px; font-weight:700; color:var(--muted);}

  .menu-list{display:flex; flex-direction:column; gap:8px;}
  .menu-item{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--surface); border:1px solid var(--surface-border); border-radius:14px; padding:16px;
  }
  .menu-item .left{display:flex; align-items:center; gap:12px;}
  .menu-item .ic{width:38px; height:38px; border-radius:11px; background:rgba(91,110,245,0.14); display:flex; align-items:center; justify-content:center; font-size:17px;}
  .menu-item .title{font-size:14px; font-weight:600;}
  .menu-item .badge{font-size:11px; font-weight:700; color:var(--danger); background:rgba(242,107,107,0.14); padding:3px 9px; border-radius:999px;}
  .menu-item .arrow{color:var(--muted);}

  .logout{
    display:block; text-align:center; margin-top:26px; padding:12px; border-radius:13px;
    background:var(--surface); border:1px solid var(--surface-border); color:var(--danger); font-weight:600; font-size:13.5px;
  }
</style>
</head>
<body>

<header>
  <div class="nav">
    <div class="brand">Earn<span>Nova</span></div>
    <div class="admin-tag">ADMIN</div>
  </div>
</header>

<div class="wrap">

  <div class="stat-grid">
    <div class="stat-card"><div class="label">Total Users</div><div class="value" id="totalUsers">—</div></div>
    <div class="stat-card alert"><div class="label">Pending Deposits</div><div class="value" id="pendingDeposits">—</div></div>
    <div class="stat-card alert"><div class="label">Pending Withdrawals</div><div class="value" id="pendingWithdrawals">—</div></div>
    <div class="stat-card alert"><div class="label">Pending Task Reviews</div><div class="value" id="pendingTasks">—</div></div>
  </div>

  <div class="section-head"><h2>MANAGE</h2></div>
  <div class="menu-list">
    <a class="menu-item" href="deposits.html">
      <div class="left"><div class="ic">💳</div><div class="title">Deposit Requests</div></div>
      <div style="display:flex; align-items:center; gap:8px;"><span class="badge" id="depBadge" style="display:none;"></span><span class="arrow">›</span></div>
    </a>
    <a class="menu-item" href="withdrawals.html">
      <div class="left"><div class="ic">📤</div><div class="title">Withdrawal Requests</div></div>
      <div style="display:flex; align-items:center; gap:8px;"><span class="badge" id="wdBadge" style="display:none;"></span><span class="arrow">›</span></div>
    </a>
    <a class="menu-item" href="tasks.html">
      <div class="left"><div class="ic">💼</div><div class="title">Tasks & Submissions</div></div>
      <div style="display:flex; align-items:center; gap:8px;"><span class="badge" id="subBadge" style="display:none;"></span><span class="arrow">›</span></div>
    </a>
    <a class="menu-item" href="users.html">
      <div class="left"><div class="ic">👥</div><div class="title">Users</div></div>
      <span class="arrow">›</span>
    </a>
    <a class="menu-item" href="settings.html">
      <div class="left"><div class="ic">⚙️</div><div class="title">Platform Settings</div></div>
      <span class="arrow">›</span>
    </a>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>
<script>
  requireAdmin(async () => {
    try {
      const [usersSnap, depSnap, wdSnap, subSnap] = await Promise.all([
        db.collection(COL.users).get(),
        db.collection(COL.deposits).where('status', '==', 'Pending Verification').get(),
        db.collection(COL.withdrawals).where('status', '==', 'Pending Review').get(),
        db.collection(COL.submissions).where('status', 'in', ['Submitted', 'Under Review']).get()
      ]);

      document.getElementById('totalUsers').textContent = usersSnap.size;
      document.getElementById('pendingDeposits').textContent = depSnap.size;
      document.getElementById('pendingWithdrawals').textContent = wdSnap.size;
      document.getElementById('pendingTasks').textContent = subSnap.size;

      if (depSnap.size > 0) { const b = document.getElementById('depBadge'); b.textContent = depSnap.size; b.style.display = 'inline-block'; }
      if (wdSnap.size > 0) { const b = document.getElementById('wdBadge'); b.textContent = wdSnap.size; b.style.display = 'inline-block'; }
      if (subSnap.size > 0) { const b = document.getElementById('subBadge'); b.textContent = subSnap.size; b.style.display = 'inline-block'; }
    } catch (err) {
      console.error(err);
    }
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — EarnNova</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E1F; --surface:rgba(255,255,255,0.045); --surface-border:rgba(255,255,255,0.09);
    --text:#EDEFF7; --muted:#8D94B8; --indigo:#5B6EF5; --indigo-soft:#818CF8; --teal:#22D3B8; --danger:#F26B6B;
    --radius:18px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:radial-gradient(circle at 15% 0%, rgba(91,110,245,0.16), transparent 45%), var(--bg);
    color:var(--text); font-family:'Inter', sans-serif; padding-bottom:40px;
  }
  h1,h2,.brand{font-family:'Sora', sans-serif;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:760px; margin:0 auto; padding:0 18px;}

  header{
    position:sticky; top:0; z-index:50; backdrop-filter:blur(14px);
    background:rgba(10,14,31,0.75); border-bottom:1px solid var(--surface-border);
  }
  .nav{display:flex; align-items:center; justify-content:space-between; padding:14px 18px; max-width:760px; margin:0 auto;}
  .brand{font-weight:700; font-size:18px;}
  .brand span{color:var(--indigo-soft);}
  .admin-tag{font-size:10.5px; font-weight:700; color:var(--teal); background:rgba(34,211,184,0.14); padding:4px 10px; border-radius:999px;}

  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:20px;}
  .stat-card{background:var(--surface); border:1px solid var(--surface-border); border-radius:var(--radius); padding:16px;}
  .stat-card .label{color:var(--muted); font-size:12px;}
  .stat-card .value{font-family:'Sora'; font-size:22px; font-weight:700; margin-top:6px;}
  .stat-card.alert .value{color:var(--danger);}

  .section-head{margin-top:26px; margin-bottom:12px;}
  .section-head h2{font-size:15.5px; font-weight:700; color:var(--muted);}

  .menu-list{display:flex; flex-direction:column; gap:8px;}
  .menu-item{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--surface); border:1px solid var(--surface-border); border-radius:14px; padding:16px;
  }
  .menu-item .left{display:flex; align-items:center; gap:12px;}
  .menu-item .ic{width:38px; height:38px; border-radius:11px; background:rgba(91,110,245,0.14); display:flex; align-items:center; justify-content:center; font-size:17px;}
  .menu-item .title{font-size:14px; font-weight:600;}
  .menu-item .badge{font-size:11px; font-weight:700; color:var(--danger); background:rgba(242,107,107,0.14); padding:3px 9px; border-radius:999px;}
  .menu-item .arrow{color:var(--muted);}

  .logout{
    display:block; text-align:center; margin-top:26px; padding:12px; border-radius:13px;
    background:var(--surface); border:1px solid var(--surface-border); color:var(--danger); font-weight:600; font-size:13.5px;
  }

  /* ===== Glacier animated background + glass motion ===== */
  .glacier-bg{ position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
  .glacier-bg span{ position:absolute; border-radius:50%; filter:blur(70px); opacity:0.32; will-change:transform; }
  .glacier-bg span:nth-child(1){ width:280px; height:280px; background:#5B6EF5; top:-90px; left:-70px; animation:glacierFloat1 22s ease-in-out infinite; }
  .glacier-bg span:nth-child(2){ width:240px; height:240px; background:#22D3B8; top:35%; right:-90px; animation:glacierFloat2 26s ease-in-out infinite; }
  .glacier-bg span:nth-child(3){ width:220px; height:220px; background:#818CF8; bottom:-80px; left:25%; animation:glacierFloat3 20s ease-in-out infinite; }
  @keyframes glacierFloat1{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(30px,40px) scale(1.12);} }
  @keyframes glacierFloat2{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-35px,-25px) scale(1.08);} }
  @keyframes glacierFloat3{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(25px,-35px) scale(1.1);} }

  @keyframes glassFadeUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  .card, .stat-card, .main-card, .task-card, .item, .hero-card, .bal-card, .balance-card,
  .activity-item, .method, .plan, .cat-card, .step, .meta-card, .sub-card, .head-card,
  .ref-item, .menu-item, .note, .confirm-box, .status-banner, .search-box, .task-details-card{
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    animation: glassFadeUp 0.55s cubic-bezier(.2,.7,.3,1) both;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .card:active, .stat-card:active, .item:active, .task-card:active,
  .activity-item:active, .method:active, .ref-item:active, .menu-item:active{
    transform: scale(0.98);
  }
  a.task-card:hover, a.activity-item:hover, .menu-item:hover{
    border-color: rgba(91,110,245,0.4);
    box-shadow: 0 8px 30px rgba(91,110,245,0.12);
  }

  /* Glass shimmer sweep on the big hero-style panels */
  .hero-card, .bal-card, .balance-card, .main-card.wide, .head-card{
    position: relative;
    overflow: hidden;
  }
  .hero-card::before, .bal-card::before, .balance-card::before, .main-card.wide::before, .head-card::before{
    content: '';
    position: absolute;
    top: 0; left: -60%;
    width: 50%; height: 100%;
    background: linear-gradient(115deg, transparent, rgba(255,255,255,0.16), transparent);
    transform: skewX(-18deg);
    animation: glassShimmer 5.5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes glassShimmer{
    0%{ left:-60%; }
    45%{ left:130%; }
    100%{ left:130%; }
  }

  header{
    backdrop-filter: blur(20px) saturate(160%) !important;
    -webkit-backdrop-filter: blur(20px) saturate(160%) !important;
  }

  button, .btn-primary, .btn-approve, .nav-cta{
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  button:active, .btn-primary:active{ transform: scale(0.97); }
  button:not(:disabled):hover, .btn-primary:hover{ filter: brightness(1.08); }
</style>
</head>
<body>
<div class="glacier-bg"><span></span><span></span><span></span></div>

<header>
  <div class="nav">
    <div class="brand">Earn<span>Nova</span></div>
    <div class="admin-tag">ADMIN</div>
  </div>
</header>

<div class="wrap">

  <div class="stat-grid">
    <div class="stat-card"><div class="label">Total Users</div><div class="value" id="totalUsers">—</div></div>
    <div class="stat-card alert"><div class="label">Pending Deposits</div><div class="value" id="pendingDeposits">—</div></div>
    <div class="stat-card alert"><div class="label">Pending Withdrawals</div><div class="value" id="pendingWithdrawals">—</div></div>
    <div class="stat-card alert"><div class="label">Pending Mining Rewards</div><div class="value" id="pendingMining">—</div></div>
  </div>

  <div class="section-head"><h2>MANAGE</h2></div>
  <div class="menu-list">
    <a class="menu-item" href="deposits.html">
      <div class="left"><div class="ic">💳</div><div class="title">Deposit Requests</div></div>
      <div style="display:flex; align-items:center; gap:8px;"><span class="badge" id="depBadge" style="display:none;"></span><span class="arrow">›</span></div>
    </a>
    <a class="menu-item" href="withdrawals.html">
      <div class="left"><div class="ic">📤</div><div class="title">Withdrawal Requests</div></div>
      <div style="display:flex; align-items:center; gap:8px;"><span class="badge" id="wdBadge" style="display:none;"></span><span class="arrow">›</span></div>
    </a>
    <a class="menu-item" href="mining.html">
      <div class="left"><div class="ic">⛏️</div><div class="title">MineNova Settings</div></div>
      <div style="display:flex; align-items:center; gap:8px;"><span class="badge" id="miningBadge" style="display:none;"></span><span class="arrow">›</span></div>
    </a>
    <a class="menu-item" href="users.html">
      <div class="left"><div class="ic">👥</div><div class="title">Users</div></div>
      <span class="arrow">›</span>
    </a>
    <a class="menu-item" href="settings.html">
      <div class="left"><div class="ic">⚙️</div><div class="title">Platform Settings</div></div>
      <span class="arrow">›</span>
    </a>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>
<script>
  requireAdmin(async () => {
    try {
      const [usersSnap, depSnap, wdSnap, miningSnap] = await Promise.all([
        db.collection(COL.users).get(),
        db.collection(COL.deposits).where('status', '==', 'Pending Verification').get(),
        db.collection(COL.withdrawals).where('status', '==', 'Pending Review').get(),
        db.collection(COL.mining).where('status', 'in', ['Completed', 'Stopped']).get()
      ]);

      document.getElementById('totalUsers').textContent = usersSnap.size;
      document.getElementById('pendingDeposits').textContent = depSnap.size;
      document.getElementById('pendingWithdrawals').textContent = wdSnap.size;
      document.getElementById('pendingMining').textContent = miningSnap.size;

      if (depSnap.size > 0) { const b = document.getElementById('depBadge'); b.textContent = depSnap.size; b.style.display = 'inline-block'; }
      if (wdSnap.size > 0) { const b = document.getElementById('wdBadge'); b.textContent = wdSnap.size; b.style.display = 'inline-block'; }
      if (miningSnap.size > 0) { const b = document.getElementById('miningBadge'); b.textContent = miningSnap.size; b.style.display = 'inline-block'; }
    } catch (err) {
      console.error(err);

    }
  });
</script>
</body>
</html>

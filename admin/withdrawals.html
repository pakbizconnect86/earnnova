<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdrawal Requests — EarnNova Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E1F; --surface:rgba(255,255,255,0.045); --surface-border:rgba(255,255,255,0.09);
    --text:#EDEFF7; --muted:#8D94B8; --indigo:#5B6EF5; --indigo-soft:#818CF8; --teal:#22D3B8; --danger:#F26B6B;
    --radius:18px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:radial-gradient(circle at 15% 0%, rgba(91,110,245,0.16), transparent 45%), var(--bg);
    color:var(--text); font-family:'Inter', sans-serif; padding-bottom:40px;
  }
  h1,.brand{font-family:'Sora', sans-serif;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:700px; margin:0 auto; padding:0 18px;}

  header{
    position:sticky; top:0; z-index:50; backdrop-filter:blur(14px);
    background:rgba(10,14,31,0.75); border-bottom:1px solid var(--surface-border);
  }
  .nav{display:flex; align-items:center; gap:14px; padding:14px 18px; max-width:700px; margin:0 auto;}
  .back{font-size:18px;}
  .nav h1{font-size:16px; font-weight:700;}

  .filter-row{display:flex; gap:8px; overflow-x:auto; margin-top:16px; padding-bottom:4px;}
  .filter-chip{
    flex-shrink:0; padding:8px 14px; border-radius:999px; font-size:12.5px; font-weight:600;
    border:1px solid var(--surface-border); background:var(--surface); color:var(--muted); cursor:pointer;
  }
  .filter-chip.active{background:rgba(91,110,245,0.16); border-color:rgba(91,110,245,0.4); color:var(--indigo-soft);}

  .list{display:flex; flex-direction:column; gap:10px; margin-top:16px;}
  .item{background:var(--surface); border:1px solid var(--surface-border); border-radius:var(--radius); padding:16px;}
  .item-top{display:flex; justify-content:space-between; align-items:flex-start;}
  .item-amt{font-family:'Sora'; font-weight:800; font-size:18px; color:var(--teal);}
  .item-method{font-size:11.5px; color:var(--indigo-soft); font-weight:600; margin-top:2px;}
  .item-status{padding:4px 10px; border-radius:999px; font-size:10.5px; font-weight:700;}
  .item-status.Pending_Review{background:rgba(91,110,245,0.14); color:var(--indigo-soft);}
  .item-status.Additional_Verification_Required{background:rgba(245,185,91,0.14); color:#F5B95B;}
  .item-status.Approved_·_Paid, .item-status.Approved{background:rgba(34,211,184,0.14); color:var(--teal);}
  .item-status.Rejected{background:rgba(242,107,107,0.14); color:var(--danger);}

  .detail-grid{margin-top:12px; display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--muted);}
  .detail-grid b{color:var(--text);}

  .ref-input{margin-top:12px;}
  .ref-input input{
    width:100%; background:rgba(255,255,255,0.04); border:1px solid var(--surface-border);
    border-radius:11px; padding:10px 12px; color:var(--text); font-size:13px; outline:none;
  }

  .action-row{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .action-row button{
    flex:1; min-width:90px; padding:10px 6px; border:none; border-radius:11px; font-weight:600; font-size:11.5px; cursor:pointer;
  }
  .btn-paid{background:linear-gradient(135deg, var(--teal), #0E7A38); color:#fff;}
  .btn-verify{background:rgba(245,185,91,0.14); border:1px solid rgba(245,185,91,0.3) !important; color:#F5B95B;}
  .btn-reject{background:rgba(242,107,107,0.14); border:1px solid rgba(242,107,107,0.3) !important; color:var(--danger);}
  button:disabled{opacity:0.5;}

  .empty{color:var(--muted); font-size:13.5px; text-align:center; padding:36px 0;}

  /* ===== Glacier animated background + glass motion ===== */
  .glacier-bg{ position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
  .glacier-bg span{ position:absolute; border-radius:50%; filter:blur(70px); opacity:0.32; will-change:transform; }
  .glacier-bg span:nth-child(1){ width:280px; height:280px; background:#5B6EF5; top:-90px; left:-70px; animation:glacierFloat1 22s ease-in-out infinite; }
  .glacier-bg span:nth-child(2){ width:240px; height:240px; background:#22D3B8; top:35%; right:-90px; animation:glacierFloat2 26s ease-in-out infinite; }
  .glacier-bg span:nth-child(3){ width:220px; height:220px; background:#818CF8; bottom:-80px; left:25%; animation:glacierFloat3 20s ease-in-out infinite; }
  @keyframes glacierFloat1{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(30px,40px) scale(1.12);} }
  @keyframes glacierFloat2{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-35px,-25px) scale(1.08);} }
  @keyframes glacierFloat3{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(25px,-35px) scale(1.1);} }

  @keyframes glassFadeUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

  /* Lightweight cards (lists/repeated items) — fade-in only, NO blur (keeps scrolling smooth) */
  .stat-card, .item, .task-card, .activity-item, .method, .plan, .cat-card, .step,
  .meta-card, .sub-card, .ref-item, .menu-item, .h-item, .row{
    animation: glassFadeUp 0.4s ease both;
    transition: transform 0.15s ease, border-color 0.2s ease;
  }
  .stat-card:active, .item:active, .task-card:active, .activity-item:active,
  .method:active, .ref-item:active, .menu-item:active, .h-item:active{
    transform: scale(0.98);
  }
  a.task-card:hover, a.activity-item:hover, .menu-item:hover{
    border-color: rgba(91,110,245,0.4);
  }

  /* Prominent panels only — this is where the blur/glass look actually shows */
  .card, .main-card, .hero-card, .bal-card, .balance-card, .head-card, .note,
  .confirm-box, .status-banner, .search-box, .task-details-card, .rig-card,
  .progress-card, .power-note, .disclaimer, .current-card, .reply-box{
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    animation: glassFadeUp 0.5s cubic-bezier(.2,.7,.3,1) both;
  }

  /* Glass shimmer sweep on the big hero-style panels */
  .hero-card, .bal-card, .balance-card, .main-card.wide, .head-card{
    position: relative;
    overflow: hidden;
  }
  .hero-card::before, .bal-card::before, .balance-card::before, .main-card.wide::before, .head-card::before{
    content: '';
    position: absolute;
    top: 0; left: -60%;
    width: 50%; height: 100%;
    background: linear-gradient(115deg, transparent, rgba(255,255,255,0.16), transparent);
    transform: skewX(-18deg);
    animation: glassShimmer 5.5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes glassShimmer{
    0%{ left:-60%; }
    45%{ left:130%; }
    100%{ left:130%; }
  }

  header{
    backdrop-filter: blur(20px) saturate(160%) !important;
    -webkit-backdrop-filter: blur(20px) saturate(160%) !important;
  }

  button, .btn-primary, .btn-approve, .nav-cta{
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  button:active, .btn-primary:active{ transform: scale(0.97); }
  button:not(:disabled):hover, .btn-primary:hover{ filter: brightness(1.08); }

</style>
</head>
<body>
<div class="glacier-bg"><span></span><span></span><span></span></div>

<header>
  <div class="nav">
    <a class="back" href="dashboard.html">←</a>
    <h1>Withdrawal Requests</h1>
  </div>
</header>

<div class="wrap">
  <div class="filter-row" id="filterRow">
    <div class="filter-chip active" data-status="Pending Review">Pending</div>
    <div class="filter-chip" data-status="Additional Verification Required">Verifying</div>
    <div class="filter-chip" data-status="Approved / Paid">Paid</div>
    <div class="filter-chip" data-status="Rejected">Rejected</div>
    <div class="filter-chip" data-status="all">All</div>
  </div>
  <div class="list" id="list">
    <div class="empty">Loading...</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>
<script>
  function fmt(n) { return 'PKR ' + Number(n || 0).toLocaleString('en-PK'); }
  let allWithdrawals = [];
  let adminUid = null;

  function render(status) {
    const listEl = document.getElementById('list');
    const rows = status === 'all' ? allWithdrawals : allWithdrawals.filter(w => w.data.status === status);
    if (rows.length === 0) {
      listEl.innerHTML = '<div class="empty">No withdrawal requests here.</div>';
      return;
    }
    listEl.innerHTML = '';
    rows.forEach(({ id, data: w }) => {
      const dateStr = w.createdAt ? w.createdAt.toDate().toLocaleString('en-PK', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
      const statusClass = (w.status || '').replace(/ /g, '_');
      const item = document.createElement('div');
      item.className = 'item';
      item.innerHTML = `
        <div class="item-top">
          <div>
            <div class="item-amt">${fmt(w.amount)}</div>
            <div class="item-method">${w.method}</div>
          </div>
          <span class="item-status ${statusClass}">${w.status}</span>
        </div>
        <div class="detail-grid">
          <div>User: <b>${w.userName || w.userId}</b></div>
          <div>Withdrawal ID: <b>${w.withdrawalId}</b></div>
          <div>Account: <b>${w.accountHolderName} — ${w.accountNumber}</b></div>
          <div>Requested: <b>${dateStr}</b></div>
          ${w.paymentRef ? `<div>Payment Ref: <b>${w.paymentRef}</b></div>` : ''}
        </div>
        ${(w.status === 'Pending Review' || w.status === 'Additional Verification Required') ? `
        <div class="ref-input"><input placeholder="Payment reference / transaction ID" id="ref-${id}"></div>
        <div class="action-row">
          <button class="btn-paid" data-action="paid" data-id="${id}">Mark as Paid</button>
          <button class="btn-verify" data-action="verify" data-id="${id}">Request Verification</button>
          <button class="btn-reject" data-action="reject" data-id="${id}">Reject</button>
        </div>` : ''}
      `;
      listEl.appendChild(item);
    });
  }

  document.getElementById('filterRow').addEventListener('click', (e) => {
    const chip = e.target.closest('.filter-chip');
    if (!chip) return;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    render(chip.dataset.status);
  });

  document.getElementById('list').addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const id = btn.dataset.id;
    const action = btn.dataset.action;
    const wd = allWithdrawals.find(w => w.id === id);
    if (!wd) return;

    let paymentRef = null;
    let verifyNote = null;
    let rejectionReason = null;

    if (action === 'paid') {
      paymentRef = document.getElementById(`ref-${id}`).value.trim();
      if (!paymentRef) { alert('Please enter the payment reference / transaction ID first.'); return; }
      if (!confirm('I confirm that the payment has actually been sent.')) return;
    } else if (action === 'verify') {
      verifyNote = prompt('What additional verification is needed? (shown to the user)') || 'Additional verification is required before this withdrawal can be processed.';
    } else {
      rejectionReason = prompt('Reason for rejection:');
      if (rejectionReason === null) return;
      rejectionReason = rejectionReason || 'Not specified';
    }

    btn.disabled = true;
    btn.textContent = action === 'paid' ? 'Processing...' : action === 'verify' ? 'Requesting...' : 'Rejecting...';

    try {
      if (action === 'paid') {
        const walletRef = db.collection(COL.wallets).doc(wd.data.userId);
        const walletDoc = await walletRef.get();
        const w = walletDoc.data() || { availableBalance: 0, totalWithdrawn: 0 };

        if (w.availableBalance < wd.data.amount) {
          alert('User no longer has sufficient available balance for this withdrawal.');
          btn.disabled = false;
          btn.textContent = 'Mark as Paid';
          return;
        }

        const newBalance = w.availableBalance - wd.data.amount;
        const newTotalWithdrawn = (w.totalWithdrawn || 0) + wd.data.amount;
        await walletRef.update({
          availableBalance: newBalance,
          totalWithdrawn: newTotalWithdrawn,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        await db.collection(COL.transactions).add({
          transactionId: generateRefId('TX'),
          userId: wd.data.userId,
          type: 'Withdrawal',
          amount: wd.data.amount,
          previousBalance: w.availableBalance,
          newBalance,
          reference: wd.data.withdrawalId,
          status: 'Approved',
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          createdBy: adminUid
        });

        await db.collection(COL.withdrawals).doc(id).update({
          status: 'Approved / Paid', paymentRef, approvedBy: adminUid, approvedAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        await db.collection(COL.notifications).add({
          userId: wd.data.userId, title: 'Withdrawal completed',
          message: `Your withdrawal of ${fmt(wd.data.amount)} has been marked as paid. Reference: ${paymentRef}`,
          read: false, createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      } else if (action === 'verify') {
        await db.collection(COL.withdrawals).doc(id).update({
          status: 'Additional Verification Required', verificationNote: verifyNote,
          reviewedBy: adminUid, reviewedAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        await db.collection(COL.notifications).add({
          userId: wd.data.userId, title: 'Withdrawal needs verification',
          message: verifyNote,
          read: false, createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      } else {
        await db.collection(COL.withdrawals).doc(id).update({
          status: 'Rejected', rejectionReason, reviewedBy: adminUid, reviewedAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        await db.collection(COL.notifications).add({
          userId: wd.data.userId, title: 'Withdrawal rejected',
          message: `Your withdrawal of ${fmt(wd.data.amount)} was rejected. Reason: ${rejectionReason}`,
          read: false, createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }

      await db.collection(COL.adminLogs).add({
        adminId: adminUid,
        action: action === 'paid' ? 'Withdrawal marked paid' : action === 'verify' ? 'Withdrawal verification requested' : 'Withdrawal rejected',
        targetUserId: wd.data.userId, amount: wd.data.amount, reference: wd.data.withdrawalId,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      location.reload();
    } catch (err) {
      console.error(err);
      alert('Ooh, that hit an iceberg 🧊 — give it another try!');
      btn.disabled = false;
      btn.textContent = action === 'paid' ? 'Mark as Paid' : action === 'verify' ? 'Request Verification' : 'Reject';
    }
  });

  requireAdmin(async (user) => {
    adminUid = user.uid;
    try {
      const wdSnap = await db.collection(COL.withdrawals).orderBy('createdAt', 'desc').get();
      allWithdrawals = [];
      for (const doc of wdSnap.docs) {
        const w = doc.data();
        const userDoc = await db.collection(COL.users).doc(w.userId).get();
        w.userName = userDoc.exists ? userDoc.data().fullName : w.userId;
        allWithdrawals.push({ id: doc.id, data: w });
      }
      render('Pending Review');
    } catch (err) {
      console.error(err);
      document.getElementById('list').innerHTML = '<div class="empty">Ooh, that hit an iceberg 🧊 — give it another try!</div>';
    }
  });
</script>
</body>
</html>
